- id: "decision_boundary.authority_first.before-asserting-a-claim"
  anchor: "decision_boundary/authority_first#1"
  source: "CLAUDE.md"
  text: "Before asserting a claim, NAME THE SURFACE THAT OWNS IT and read that — deriving what a surface already records is the failure this retires. Duration/budget/watchdog → `shared/timeout_registry.py` (a READ surface, not only a registration duty). What a ticket's work IS → its DESCRIPTION (comments are history, however long the tail). What a return value/sentinel/flag MEANS → its own docstring. What happened in this repo → `git log`/file history, never a directory listing. Nothing owns it? Say \"I derived this\" — sounding established is not being established."
  text_sha256: "badb03299f1bdab2409013f136bb318c67e59556d4ea84ff922cc29b977edc48"
  why_pointer: "docs/governance/agent-doctrine-evidence.md#authority_first"
