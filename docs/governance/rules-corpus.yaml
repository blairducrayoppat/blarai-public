  severity: "normal"
  owner: "session"
- id: "stack.trust-spine"
  anchor: "stack#3"
  source: "CLAUDE.md"
  text: "Trust spine: ONE Policy-Agent adjudication door for every risky action; fail-closed everywhere. Egress is per-SCOPE, never global: each scope stays denied until its own ceremony, and a live scope is still held by multiple independent locks — the tool-loop dispatch check (always against the deterministic egress allowlist), the door's own check (ONE slot, last-write-wins; since #1586 both sites register the same request-keyed adjudicator, so the layers agree for every purpose but operator-paste), the per-turn operator envelope, the armed socket guard, the outbound exfil screen, the single-file httpx import scan. Never state which scopes are live from memory or from a docstring — read default.toml + docs/runbooks/."
  text_sha256: "9530634af6f23d8a1c51d3647cf6a7976b18f9b4b72692e663fcd7fa4b853e86"
  why_pointer: ""
  scope: ["security"]
  enforcement:
  - {"kind": "none", "ref": ""}
  severity: "normal"
  owner: "session"
