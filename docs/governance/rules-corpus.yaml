  owner: "session"
- id: "vikunja.labels"
  anchor: "vikunja#5"
  source: ".claude/rules/vikunja.md"
  text: "Labels: use the server-canonical exact names (Active, Complete, Blocked, Architecture, Infrastructure, Testing, Documentation, Security, Defunct, Gate:*) — verify via list_labels; never invent variants (a prior doc's \"P5-Active\" did not exist on the server)."
  text_sha256: "23e265d883b29ae7b0fedb00c9fb979a0e18b7cdc4015ccca59ffa58fa74c5d9"
  why_pointer: ""
  scope: ["vikunja"]
