  severity: "critical"
  owner: "session"
- id: "git_discipline.cleanup.clean-throwaway-scratch-as"
  anchor: "git_discipline/cleanup#3"
  source: "CLAUDE.md"
  text: "Clean throwaway scratch as you go; keep evidence artifacts (measurements, gate outputs). Never treat his repos/branches as scratch."
  text_sha256: "9aef2c351bc7c9bfc0b9780aa8c17b4328ea42c125e242ed352e928a6ca167a4"
  why_pointer: ""
  scope: ["git", "tests"]
  enforcement:
