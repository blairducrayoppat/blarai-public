  severity: "normal"
  owner: "session"
- id: "git_discipline.cleanup.inventory-dirty-worktrees-before-touching"
  anchor: "git_discipline/cleanup#2"
  source: "CLAUDE.md"
  text: "Inventory dirty worktrees before touching — uncommitted changes are someone's work; never assume abandonment."
  text_sha256: "45850cd38f72fec87c42afeb1dd28583ca263c2f64217341cff72f4fd6a100ec"
  why_pointer: ""
  scope: ["git"]
  enforcement:
  - {"kind": "none", "ref": ""}
  severity: "normal"
  owner: "session"
- id: "git_discipline.cleanup.remove-each-worktree-when"
  anchor: "git_discipline/cleanup#1"
  source: "CLAUDE.md"
  text: "Remove each worktree when its work is merged AND reported — not at first commit (mid-task commits are checkpoints; deleting on a stale tip orphans later commits and strands the builder)."
  text_sha256: "d4c98f26314c3e101ede668286481a284f54f1f3417b1c083c9f4b72333735e9"
  why_pointer: ""
  scope: ["git"]
