- id: "testing.protect_the_gate.the-gate-must-not"
  anchor: "testing/protect_the_gate#2"
  source: ".claude/rules/testing.md"
  text: "The gate must not kill / be killed by the live system. Pattern-match every new test against the known kill shapes (each has happened; each now has a structural control): a leaked service turning failures into silent skips; an in-test instance-lock os._exit killing the collector mid-run; a boot-reconcile tree-killing a live dispatch."
  text_sha256: "321fde1856c9d42cc2abb18bfe9251005a78bd951746d78218e6a59046c9c19d"
  why_pointer: "docs/governance/agent-doctrine-evidence.md#Gate kill shapes"
  scope: ["tests"]
  enforcement:
  - {"kind": "gate", "ref": "conftest.py", "note": "port-5001 leak detector fixture"}
  severity: "normal"
  owner: "session"
- id: "testing.seams.author-verifier"
  anchor: "testing/seams#4"
  source: ".claude/rules/testing.md"
  text: "Author ≠ verifier: adversarial review stays independent; the reviewer never writes the fix."
  text_sha256: "9f37678825bb46758a6f0f04efe02516681d33aaae1b703790244793ff8ba451"
  why_pointer: ""
  scope: ["tests"]
  enforcement:
  - {"kind": "reviewer", "ref": ".claude/agents/adversarial-reviewer.md", "note": "independence is the agent's contract"}
  severity: "normal"
  owner: "session"
- id: "testing.seams.documentation-is-not-evidence"
  anchor: "testing/seams#1"
  source: "CLAUDE.md"
  text: "Documentation is NOT evidence (the same lesson, aimed outward — applies to evaluation, not just testing). A README/datasheet/integration-plan describes intent, a product family, or a past state; source, manifests, shipped binaries, and on-chip measurements describe what is true here and now. Evaluating ANY third-party artifact for adoption: read the artifact, not its description, and RECORD which artifacts were read. A recommendation resting on vendor documentation alone is incomplete by definition — same standing as an unrecorded measurement; vendor prose has repeatedly made the riskier option look safer than the artifact showed."
  text_sha256: "c661d2dbd149c3b881fb193f48e371f20354b6b0be27b0c3945f9d0b1139e22e"
  why_pointer: "docs/governance/agent-doctrine-evidence.md#Documentation is not evidence"
  scope: ["tests"]
  enforcement:
  - {"kind": "none", "ref": ""}
  severity: "normal"
  owner: "session"
- id: "testing.seams.mocks-lie"
  anchor: "testing/seams#2"
  source: ".claude/rules/testing.md"
  text: "Mocks lie. Canonical failures: mock-passes-but-prod-crashes (mock-shape divergence); built-but-wired-into-nothing (control exists, nothing calls it — recurred repeatedly). Therefore: drive REAL objects through REAL entry points; verify REACHABILITY, not just behavior; live-verify on the actual system before claiming done. The screen has caught what three green sweeps missed."
  text_sha256: "c5fda0640163f824e22697594eed06e29c1c5c2b374780dfb3addd4f83238c61"
  why_pointer: ""
  scope: ["tests"]
  enforcement:
  - {"kind": "none", "ref": ""}
  severity: "normal"
  owner: "session"
- id: "testing.seams.test-the-boundary-itself"
  anchor: "testing/seams#3"
  source: ".claude/rules/testing.md"
  text: "Test the boundary itself, not both sides separately: vsock handshake, IPC dispatcher, WinUI↔backend passthrough allowlist (gate test parses the C# array, fails loudly naming missing commands), egress door driven through the REAL policy checker."
  text_sha256: "0110f3012bfcbd0c167838120cb200cf2e5e79d7dae53419b167f4e1b2e7938a"
  why_pointer: ""
  scope: ["security", "tests"]
  enforcement:
  - {"kind": "none", "ref": ""}
  severity: "normal"
  owner: "session"
- id: "testing.standing_gate.deselected-tiers-run-at-their-own-ceremonies"
  anchor: "testing/standing_gate#2"
  source: ".claude/rules/testing.md"
  text: "Deselected tiers run at their own ceremonies: @hardware (model-loaded, real Arc 140V), @winui (C# headless project), @slow. Model-quality eval gate: `python -m evals.run --suite all` — committed baselines, regression exit codes with teeth."
  text_sha256: "01bd4c8d97596db80debfcdb98861858f2d323500d757a71bbf4d1aafb347b85"
  why_pointer: ""
  scope: ["git", "security", "tests"]
  enforcement:
  - {"kind": "none", "ref": ""}
  severity: "normal"
  owner: "session"
- id: "testing.standing_gate.every-fix-ships-its"
  anchor: "testing/standing_gate#3"
  source: ".claude/rules/testing.md"
  text: "Every fix ships its regression lock in the same change. New/changed timeouts register in shared/timeout_registry.py (itself gate-locked)."
  text_sha256: "774a7c75b529c2f80663678061aa3f49fdb5304fbeaeb913f78dc4e97ac05f6d"
  why_pointer: ""
  scope: ["security", "tests"]
  enforcement:
  - {"kind": "test", "ref": "tests/integration/test_timeout_registry.py", "note": "timeout-registration arm only, not the regression-lock arm"}
  severity: "normal"
  owner: "session"
- id: "testing.standing_gate.selection"
  anchor: "testing/standing_gate#1"
  source: ".claude/rules/testing.md"
  text: "Selection: `pytest shared/ services/ launcher/ tests/integration/ tests/security/ -m \"not hardware and not winui and not slow\"`. Fast form: `python scripts/run_standing_gate.py` (6 parallel groups, same tests, about 12 min vs 24; exits 3 if the count differs from the single collection). Bar: 0 failed, 0 skipped in a clean environment. A skip is investigated, never waved through. Current counts live in <status_snapshot> + the ticket record — never pin them elsewhere in doctrine."
  text_sha256: "990a862df9f4ba4afd5d5582642041d25a6d89e2d082b9ee7c929eb8cc2b5a13"
  why_pointer: ""
  scope: ["security", "tests", "vikunja"]
  enforcement:
  - {"kind": "none", "ref": ""}
  severity: "normal"
  owner: "session"
- id: "user_operator.directives.his-attention-is-a-managed-resource"
  anchor: "user_operator/directives#4"
  source: "CLAUDE.md"
  text: "His attention is a managed resource: outputs >~30 lines go to a workspace file with a short chat pointer. No praise/commendation sections anywhere. Warn in one line before any screen-taking action, then proceed without waiting for him."
  text_sha256: "f8bd72ac2f87055709ba454e1109730ca738747a6051c6aa60e513eb7fedb9be"
  why_pointer: ""
  scope: []
  enforcement:
  - {"kind": "none", "ref": ""}
  severity: "normal"
  owner: "session"
- id: "user_operator.directives.in-everything-he-reads"
  anchor: "user_operator/directives#3"
  source: "CLAUDE.md"
  text: "In everything he reads: spell out every acronym on first use; lead with the outcome, not the mechanism."
  text_sha256: "32b431faefd5d1f9b555f97298ea71339b359660430fbdbdf9c67e6769414cb3"
  why_pointer: ""
  scope: []
  enforcement:
  - {"kind": "none", "ref": ""}
  severity: "normal"
  owner: "session"
- id: "user_operator.directives.never-ask-him-a-technical-question"
  anchor: "user_operator/directives#1"
  source: "CLAUDE.md"
  text: "NEVER ask him a technical question. Research, decide, report the decision in plain language. Presenting him a technical option menu is a dropped responsibility, not diligence."
  text_sha256: "056fe44ff17237a9296a61709959c1d1af7325399a58d1827274b59c5c0a3018"
  why_pointer: ""
  scope: []
  enforcement:
  - {"kind": "none", "ref": ""}
  severity: "normal"
  owner: "session"
- id: "user_operator.directives.treat-his-technical-claims"
  anchor: "user_operator/directives#2"
  source: "CLAUDE.md"
  text: "Treat his technical claims as hypotheses; verify on disk before acting. He prefers correction-by-evidence over being obeyed into error."
  text_sha256: "123e4b72ee53a3e0b09972053d33c54c0f49d24de1b32d6b97e0ad83919f6bb1"
  why_pointer: ""
  scope: []
  enforcement:
  - {"kind": "none", "ref": ""}
  severity: "normal"
  owner: "session"
- id: "user_operator.facts.flat-rate-plan-token-cost"
  anchor: "user_operator/facts#2"
  source: "CLAUDE.md"
  text: "Flat-rate plan; token cost is never a constraint. Depth is never rationed."
  text_sha256: "1c34e33595c1ca5ebd44686bfd365e4c2f27cb27c080d663d2e4b6abd3feb400"
  why_pointer: ""
  scope: []
  enforcement:
  - {"kind": "none", "ref": ""}
  severity: "normal"
  owner: "session"
- id: "user_operator.facts.horizon-is-decades"
  anchor: "user_operator/facts#1"
  source: "CLAUDE.md"
  text: "Horizon is decades. Never frame work as \"nearly done.\" Public framing: \"personal research project\" / \"long-term local AI system\" — NEVER \"prototype.\""
  text_sha256: "819bf9bcaa9ad4c95b69de38e54af96679e9c2d52cab0528e0fc5e320784870b"
  why_pointer: ""
  scope: []
  enforcement:
  - {"kind": "none", "ref": ""}
  severity: "normal"
  owner: "session"
- id: "vikunja.decisions-recorded-on-the"
  anchor: "vikunja#4"
  source: ".claude/rules/vikunja.md"
  text: "Decisions recorded on the ticket that caused them — no standalone decision tickets. Sustained multi-artifact work opens a task at start. Hardening follow-ups / deferred cleanup ALWAYS get tickets."
  text_sha256: "a7439fd10d90e023ed65548136332d741948532b1c524e1f4489649047237457"
  why_pointer: ""
  scope: ["vikunja"]
  enforcement:
