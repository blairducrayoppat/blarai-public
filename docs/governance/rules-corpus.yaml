- id: "git_discipline.absolute_rules.no-destructive-git-operations-ever"
  anchor: "git_discipline/absolute_rules#1"
  source: "CLAUDE.md"
  text: "NO destructive git operations, EVER: no branch deletion, force-push, history rewrite, reset --hard, checkout -- discards. A backup is not authorization. Something looks wrong → stop and surface; never \"clean up\" with a destructive verb."
  text_sha256: "d5050d0cb41640c43c7e93e8420c2908739c812b769d2ce7ddfbaca2b075ff4f"
  why_pointer: ""
  scope: ["git"]
