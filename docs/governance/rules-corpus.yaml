- id: "decision_boundary.deferral_discipline.a-deferral-is-a"
  anchor: "decision_boundary/deferral_discipline#2"
  source: "CLAUDE.md"
  text: "A DEFERRAL IS A CLAIM AND CARRIES THE BURDEN OF EVIDENCE. The `blocked-by:` predicate must name something a later session can OBSERVE (a #ticket, a date, a `symbol`, a path). \"follow-up\", \"lower priority\", \"next session\", \"out of scope for now\", \"once things settle\" are refused by the gate — they read like reasons and decide nothing. **If you cannot name the predicate, that is not a deferral, it is a fix you have not done — do it now.**"
  text_sha256: "cb70835bf6ee146643a49e29a69971bfe602616bb5fb00f99c145965d2cf5971"
  why_pointer: ""
  scope: ["tests", "vikunja"]
  enforcement:
  - {"kind": "test", "ref": "tests/security/test_disposition_discipline.py"}
