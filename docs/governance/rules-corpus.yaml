- id: "testing.protect_the_gate.baselines-are-evidence"
  anchor: "testing/protect_the_gate#4"
  source: ".claude/rules/testing.md"
  text: "Baselines are evidence: an eval baseline once encoded a parser bug as expected behavior. Cross-check baselines on substrate changes; re-measure known-fail cases at every hardware ceremony."
  text_sha256: "9c852d8568e2917da4ce36a6a1412b037d4a621ca9813888958edf9540ad067e"
  why_pointer: ""
  scope: ["tests"]
  enforcement:
