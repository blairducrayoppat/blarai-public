  severity: "normal"
  owner: "session"
- id: "journal_discipline.entry-form"
  anchor: "journal_discipline#4"
  source: ".claude/rules/journal.md"
  text: "Entry form: dated `### YYYY-MM-DD — <title naming the LESSON, not the change>` header, plain-language subtitle (`*Plain summary: …*` — the searchable index line), first-person narrative prose (not bullets, not changelog), specific numbers, real commit SHAs (no placeholders except self-reference), trade-offs with the rejected path named, ends with **Next:**. No emoji. Sized to the judgment, not the bookkeeping."
  text_sha256: "fd25400e384dd2054b0bbc783a283802247cb44f91b3bf6ddc61f8cd89f63347"
  why_pointer: ""
  scope: ["git", "journal"]
  enforcement:
