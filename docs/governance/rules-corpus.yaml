  owner: "session"
- id: "journal_discipline.parallel-sessions"
  anchor: "journal_discipline#9"
  source: ".claude/rules/journal.md"
  text: "Parallel sessions: write fragments to docs/journal_fragments/ (one file per entry; lessons proposed, never pre-numbered), NEVER append BUILD_JOURNAL.md directly. One integrator folds fragments proactively at lulls (after a merge cluster, not sprint close), numbers lessons serially, deletes fragments. A single session alone on a quiet tree may write BUILD_JOURNAL.md directly."
  text_sha256: "d8e70d15d447635688ed389854af4ba12135196c4637d962236ba1146e38862e"
  why_pointer: ""
  scope: ["git", "journal"]
  enforcement:
