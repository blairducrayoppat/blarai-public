  severity: "normal"
  owner: "session"
- id: "vikunja.if-mcp-fails-with-connection-errors"
  anchor: "vikunja#8"
  source: ".claude/rules/vikunja.md"
  text: "If MCP fails with connection errors: start the server — C:/Users/mrbla/devplatform/tools/vikunja/vikunja-v2.3.0-windows-4.0-amd64.exe (localhost:3456, local only)."
  text_sha256: "aaeac76a60e61386452a9ddc46f07d2fb657bc71652fd252812ecbf0d8a96366"
  why_pointer: ""
  scope: ["vikunja"]
  enforcement:
