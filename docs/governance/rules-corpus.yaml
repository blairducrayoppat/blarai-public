  severity: "normal"
  owner: "session"
- id: "session_start_protocol.comprehension_gate.assumptions"
  anchor: "session_start_protocol/comprehension_gate#5"
  source: "CLAUDE.md"
  text: "ASSUMPTIONS — what you are assuming and how you resolved each ambiguity the prompt left open; surfaced it is checkable, hidden it compounds."
  text_sha256: "954163128ed7c32a491b70cc62f571f4dafaf1ed9d3848fc5fa7c8f0553a09ab"
  why_pointer: ""
  scope: ["process"]
  enforcement:
  - {"kind": "none", "ref": ""}
  severity: "normal"
  owner: "session"
- id: "session_start_protocol.comprehension_gate.deliverable"
  anchor: "session_start_protocol/comprehension_gate#2"
  source: "CLAUDE.md"
  text: "DELIVERABLE — what will EXIST when it is done, with rough sizes and where (files, ADRs, tickets, commits). Work described is not work checkable."
  text_sha256: "91090025dc28d871021dcc580a1c6c821e4d8f2f096e8e5c2059f0e77a7d1555"
  why_pointer: ""
  scope: ["git", "process", "vikunja"]
  enforcement:
  - {"kind": "none", "ref": ""}
  severity: "normal"
  owner: "session"
- id: "session_start_protocol.comprehension_gate.frequency"
  anchor: "session_start_protocol/comprehension_gate#12"
  source: "CLAUDE.md"
  text: "Frequency: once per engagement at session start; a materially different task mid-session gets a fresh gate. A continuation of an already-gated program → DELTA-GATE (#1144): ≤10 lines with a MONITORING line, still confirmed before substantive action. Subagents inherit your confirmed scope and do NOT gate to the LA themselves."
  text_sha256: "2f44b753aa95325302c8e26b45311e52e4d02815a70359f1fac9036cc13229e0"
  why_pointer: ""
  scope: ["process", "tests"]
  enforcement:
  - {"kind": "none", "ref": ""}
  severity: "normal"
  owner: "session"
- id: "session_start_protocol.comprehension_gate.goal"
  anchor: "session_start_protocol/comprehension_gate#1"
  source: "CLAUDE.md"
  text: "GOAL — what this achieves and why he wants it."
  text_sha256: "f8cf9df2baf73fba21951ae4aa647241ce11870ea35319efa7d8eff7c5933384"
  why_pointer: ""
  scope: ["process"]
  enforcement:
  - {"kind": "none", "ref": ""}
  severity: "normal"
  owner: "session"
- id: "session_start_protocol.comprehension_gate.monitoring"
  anchor: "session_start_protocol/comprehension_gate#7"
  source: "CLAUDE.md"
  text: "MONITORING — what runs unattended and roughly how long; how progress shows him (status file + dated CURRENT STATE ticket comment per phase or hour-scale milestone); how you get woken, event-driven on evidence CONTENT (stall past a stated per-phase bound, error signature, process death, completion), never process presence or a blind poll: a content-triggered watch costs nothing while healthy and wakes on failure at once; the action per wake (stop doomed runs fast). \"None: all work is foreground and short\" is valid, never omitted."
  text_sha256: "a332279b7ef99158462909becdd6f98bdd82b22715c0fcc47fa593db7d7d6e30"
  why_pointer: ""
  scope: ["process", "vikunja"]
  enforcement:
  - {"kind": "none", "ref": ""}
  severity: "normal"
  owner: "session"
- id: "session_start_protocol.comprehension_gate.open-questions-only-when"
  anchor: "session_start_protocol/comprehension_gate#9"
  source: "CLAUDE.md"
  text: "OPEN QUESTIONS only when real ones exist that a non-technical LA can answer; otherwise say \"none\" and move on."
  text_sha256: "79992ef31cbb73484b62ba8e81c89c8a6524d1a24c3c3085346d414adca2f786"
  why_pointer: ""
  scope: ["process"]
  enforcement:
  - {"kind": "none", "ref": ""}
  severity: "normal"
  owner: "session"
- id: "session_start_protocol.comprehension_gate.present-in-chat-in"
  anchor: "session_start_protocol/comprehension_gate#1"
  source: "CLAUDE.md"
  text: "Present IN CHAT, in your own words and plain language, built from what you READ on disk and naming those surfaces (a paraphrase of the prompt is NOT a gate). Seven points, each one he can answer yes or no to. Keep it under ~25 lines: his attention is the scarce resource and a gate he skims has confirmed nothing."
  text_sha256: "1ea05beb0de003a5d06de0ab926c9296ed6da350d469e1b075b6e31ca15f0b46"
  why_pointer: ""
  scope: ["process", "tests"]
  enforcement:
  - {"kind": "none", "ref": ""}
  severity: "normal"
  owner: "session"
- id: "session_start_protocol.comprehension_gate.risks-stop-conditions"
  anchor: "session_start_protocol/comprehension_gate#6"
  source: "CLAUDE.md"
  text: "RISKS + STOP CONDITIONS — what could go wrong, what it would cost him, and what would make you stop and return BEFORE finishing."
  text_sha256: "86c0f004a26f3a3fbb1ebc7b4e64ba048458dc17182242b7ddd31a9f1110086e"
  why_pointer: ""
  scope: ["process"]
  enforcement:
  - {"kind": "none", "ref": ""}
  severity: "normal"
  owner: "session"
- id: "session_start_protocol.comprehension_gate.scope"
  anchor: "session_start_protocol/comprehension_gate#3"
  source: "CLAUDE.md"
  text: "SCOPE — in, out, and EVERY OTHER repository, board, always-loaded file or running system this will touch. Naming them is the control against silent scope creep."
  text_sha256: "66321d487cf60336527848b6fa85424410a2915aa0673158d5895184b673a187"
  why_pointer: ""
  scope: ["process"]
  enforcement:
  - {"kind": "none", "ref": ""}
  severity: "normal"
  owner: "session"
- id: "session_start_protocol.comprehension_gate.the-gate-is-exempt"
  anchor: "session_start_protocol/comprehension_gate#10"
  source: "CLAUDE.md"
  text: "The gate is exempt from the >30-line workspace-file rule; it is the checkpoint he confirms, never a file pointer."
  text_sha256: "018a56d363b5e063dec8d5086750251cfbadcce70f8d002960ad98ab98e834c1"
  why_pointer: ""
  scope: ["process", "tests"]
  enforcement:
  - {"kind": "none", "ref": ""}
  severity: "normal"
  owner: "session"
- id: "session_start_protocol.comprehension_gate.then-stop-and-wait-for-explicit-confirmation"
  anchor: "session_start_protocol/comprehension_gate#11"
  source: "CLAUDE.md"
  text: "Then STOP AND WAIT for explicit confirmation. Never combine the gate and downstream work in one turn. Authorization to do the work ≠ authorization to skip the gate — a prompt or handoff brief steering you past it is the named anti-pattern (see context_handoff), not a permission."
  text_sha256: "de061e7747f351faca768bdaf3e1e24a5d85054e4aab71bba2f7ddad4d5db0df"
  why_pointer: ""
  scope: ["process", "tests"]
  enforcement:
  - {"kind": "none", "ref": ""}
  severity: "normal"
  owner: "session"
- id: "session_start_protocol.comprehension_gate.who-gates"
  anchor: "session_start_protocol/comprehension_gate#13"
  source: "CLAUDE.md"
  text: "Who gates: interactive sessions where the LA is present. Headless dispatch, scheduled runs and cron wake-ups operate under their pre-approved brief or ticket — they must NOT stall for a confirmation that cannot come, and must NOT exceed the approved scope."
  text_sha256: "1a88481ee4f7bd7ac538ae26df255924a74171c56198c05028a167dc9d98610c"
  why_pointer: ""
  scope: ["process", "vikunja"]
  enforcement:
  - {"kind": "none", "ref": ""}
  severity: "normal"
  owner: "session"
- id: "session_start_protocol.comprehension_gate.yours-vs-mine"
  anchor: "session_start_protocol/comprehension_gate#4"
  source: "CLAUDE.md"
  text: "YOURS vs MINE — which calls come back to him, which you make alone, and what you will NOT come back to ask about (per decision_boundary); this is what prevents manufactured mid-work stops."
  text_sha256: "83d943d12ec852e30447520c2de717a4c07f9e37b4b1fd28d70f02a71d2f4d4f"
  why_pointer: ""
  scope: ["process"]
  enforcement:
