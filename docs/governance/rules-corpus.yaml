- id: "session_start_protocol.grounding.every-file-ticket-adr"
  anchor: "session_start_protocol/grounding#5"
  source: "CLAUDE.md"
  text: "Every file, ticket, ADR, or brief the task names — read them ON DISK; never work from a prompt's or predecessor's summary of them."
  text_sha256: "599ae73f330c58c818f041b8c2df4e7df11e34787901342c1490d1f79591d232"
