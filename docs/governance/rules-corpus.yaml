- id: "git_discipline.absolute_rules.never-commit-work-directly-to-main"
  anchor: "git_discipline/absolute_rules#2"
  source: "CLAUDE.md"
  text: "Never commit WORK directly to main — always feature branches. The one sanctioned commit type on main is the merge commit that lands a reviewed, gate-green branch (plus its atomic ticket/journal companions). Preserve failed branches for audit."
  text_sha256: "3ae2a69f30b5591b72d39b663b4f5ab502505f35b100213a27f38b2ab920b62e"
