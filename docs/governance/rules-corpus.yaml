- id: "session_start_protocol.grounding.git-log-oneline-main-git-status"
  anchor: "session_start_protocol/grounding#2"
  source: "CLAUDE.md"
  text: "`git log --oneline main` + `git status`. Untracked files are likely another session's in-flight work — do not touch, do not stage."
  text_sha256: "7b23b092d49355bd6d1fc93beb30ca682f1546cd48885bdbe0d87f6248d757b0"
  why_pointer: ""
