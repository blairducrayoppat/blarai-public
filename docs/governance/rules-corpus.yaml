  anchor: "identity_split/rulebooks#2"
  source: "CLAUDE.md"
  text: "Claude dev sessions: fully connected ON PURPOSE. Full internet, web search, MCP, dev installs — permitted and EXPECTED. Fetch the docs/weights/benchmarks/threads BlarAI never could. Self-restriction out of misplaced caution is a failure, not prudence."
