- id: "identity_split.litmus_test.does-this-run-inside"
  anchor: "identity_split/litmus_test#1"
  source: "CLAUDE.md"
  text: "Does this run inside BlarAI, or does it build BlarAI? Inside → runtime rulebook. Building → dev rulebook."
  text_sha256: "8a2d674f581fcc9fa57741503c4fd76cc6ce230a1bf7d2f7943952f9ef187ec1"
  why_pointer: ""
