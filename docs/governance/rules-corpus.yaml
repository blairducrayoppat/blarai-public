  severity: "normal"
  owner: "session"
- id: "host_environment.memory-is-the-scarcest-resource"
  anchor: "host_environment#1"
  source: "CLAUDE.md"
  text: "Memory is the scarcest resource. Measure RAM as In-Use = Total − Available, never working-set sums. Big jobs (hires image refine) must explicitly evict + lazily reload the resident 14B."
  text_sha256: "0288c3886267c4c3c0ae21a68e7394a517b33cc16e413fa99f4e38f91b05491b"
  why_pointer: ""
  scope: []
  enforcement:
