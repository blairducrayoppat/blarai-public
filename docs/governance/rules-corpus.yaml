  anchor: "decision_boundary/defect_vs_decision_test#1"
  source: "CLAUDE.md"
  text: "A defect has one correct fix you can name → fix it. A decision has trade-offs only the LA should weigh → escalate it. Never silently \"fix\" a decision. Reporting a defect without fixing it = incomplete response."
  text_sha256: "c7c22c706c7e34a31e2fbe86ab8871ec4232e4e3c818dcf88c91ee80cecdad60"
