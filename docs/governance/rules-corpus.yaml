  owner: "session"
- id: "git_discipline.shared_tree.before-any-commit-in"
  anchor: "git_discipline/shared_tree#3"
  source: "CLAUDE.md"
  text: "Before ANY commit in the primary checkout, verify `git branch --show-current` matches your intent — worktree-agent launches can silently switch the primary checkout's branch, so you may not be on the branch you think you are."
  text_sha256: "24c0320fb3e0e8bad4c1eb991adcbd3b93273b9f2a054d1eaef2d5c68633aeb1"
  why_pointer: ""
  scope: ["git"]
  enforcement:
  - {"kind": "none", "ref": ""}
  severity: "normal"
  owner: "session"
- id: "git_discipline.shared_tree.before-substantive-git-work"
  anchor: "git_discipline/shared_tree#1"
  source: "CLAUDE.md"
  text: "Before substantive git work (multi-commit sequences, branch ops, merges): ensure no concurrent agent can commit into the tree — pause or drain any live headless dispatch first. Never merge under an active dispatch."
  text_sha256: "f9f4a2990b33bbca93b8c5a7ebd85563b890660ba725511bdf785287ee10f94d"
  why_pointer: ""
  scope: ["git"]
  enforcement:
  - {"kind": "none", "ref": ""}
  severity: "normal"
  owner: "session"
- id: "git_discipline.shared_tree.no-git-add-a-ever"
  anchor: "git_discipline/shared_tree#2"
  source: "CLAUDE.md"
  text: "No `git add -A`, ever. Stage explicit paths only — blanket adds sweep other sessions' untracked work into your commit."
  text_sha256: "e5faf8e4b54b55778e1ada275176a9a696c469c36ef9883e5c7ff2ce3b79a3c2"
  why_pointer: ""
  scope: ["git"]
  enforcement:
  - {"kind": "hook", "ref": "scripts/hooks/git_rules_guard.py"}
  - {"kind": "test", "ref": "tests/security/test_git_rules_guard.py"}
  severity: "normal"
  owner: "session"
- id: "git_discipline.shared_tree.parallel-work"
  anchor: "git_discipline/shared_tree#4"
  source: "CLAUDE.md"
  text: "Parallel work: `git worktree add` (own dir, own branch), never checkout/switch a tree another session uses. Parallel journal entries → docs/journal_fragments/."
  text_sha256: "8e8301fb8b97279e76f8c50d4faf42f6df9106d840a27aacf3476094be41118f"
  why_pointer: ""
  scope: ["git", "journal"]
  enforcement:
  - {"kind": "none", "ref": ""}
  severity: "normal"
  owner: "session"
- id: "host_environment.exactly-one-hyper-v-gen"
  anchor: "host_environment#2"
  source: "CLAUDE.md"
  text: "Exactly ONE Hyper-V Gen 2 VM (Alpine) for isolated service execution; host↔guest via vsock (AF_HYPERV) only, no TCP/IP in VM. Host-mode is the default topology (AO runs host-side) — read real topology from default.toml + actual vsock wiring, never assume."
  text_sha256: "5f5ac33fdea724de77f10e14ee45a475967fc7b88d14f550cd4d559bccb82af3"
  why_pointer: ""
  scope: []
  enforcement:
