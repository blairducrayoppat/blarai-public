  source: ".claude/rules/doctrine.md"
  text: "Doctrine freshness is GATE-ENFORCED (tests/security/test_doctrine_freshness.py, #945 D8): the snapshot's gate figure must equal TEST_GOVERNANCE §1's LIVE_GATE_BASELINE line (update both in the count-changing commit); hot surfaces carry size budgets; always-loaded files are scanned for retired-world vocabulary; ACTIVE_SPRINT's refresh date must track main. A doc whose stated maintainer is a retired role is stale by definition — re-own it or retire it the day the role dies."
