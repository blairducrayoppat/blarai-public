- id: "security_by_design.application.at-design-time"
  anchor: "security_by_design/application#1"
  source: "CLAUDE.md"
  text: "At design time: name the trust boundary the feature touches, what can reach it, what it can reach, and which principles above bind it — before writing code. If a design needs a new network client, a new decrypt point, or a Policy-Agent bypass, that is a decision_boundary escalation, not a design choice."
  text_sha256: "1a6d970ee6bbc4e78e4e702732d074b36120086225349874f03f7c64966ea311"
  why_pointer: ""
  scope: ["security"]
  enforcement:
  - {"kind": "none", "ref": ""}
  severity: "normal"
  owner: "session"
- id: "security_by_design.application.at-review-time"
  anchor: "security_by_design/application#2"
  source: "CLAUDE.md"
  text: "At review time: adversarial review includes the security dimensions (reachability of the new surface, forged-input behavior, error-path behavior, what leaks on failure)."
  text_sha256: "71bb5c61e8245721f22506b2038541702ff5972c1131176cffc52d410d39f057"
  why_pointer: ""
  scope: ["security"]
  enforcement:
  - {"kind": "reviewer", "ref": ".claude/agents/adversarial-reviewer.md"}
  severity: "normal"
  owner: "session"
- id: "security_by_design.application.level-check"
  anchor: "security_by_design/application#3"
  source: "CLAUDE.md"
  text: "Level check: this system's shipped controls are the bar — match them, never dilute them. When two designs are otherwise equal, take the one with the smaller attack surface."
  text_sha256: "71c927005ef20ed8dfbf6d6d7a26f81481acbb150d6ef59d08c6992705fcb164"
  why_pointer: ""
  scope: ["security"]
  enforcement:
  - {"kind": "none", "ref": ""}
  severity: "normal"
  owner: "session"
- id: "security_by_design.posture.security-is-designed-in"
  anchor: "security_by_design/posture#1"
  source: "CLAUDE.md"
  text: "Security is designed IN from the first line, never reviewed in at the end. Every new feature, surface, or channel is a security design problem first and a functionality problem second. A build that works but was not designed to these principles is a defective build — same standing as a failing gate. Privacy is absolute; zero tolerance for leakage of his data."
  text_sha256: "a40c681ffc10c9c14e800a9c12115f3e9a0792fb650ef9098ea7ddfa8fc89327"
  why_pointer: ""
  scope: ["security", "tests"]
  enforcement:
  - {"kind": "none", "ref": ""}
  severity: "normal"
  owner: "session"
- id: "security_by_design.principles.born-encrypted"
  anchor: "security_by_design/principles#6"
  source: "CLAUDE.md"
  text: "BORN-ENCRYPTED: content-bearing data is encrypted from creation (not encrypted later), secure-delete on, decrypted bytes never touch disk except by explicit operator action."
  text_sha256: "4eb8619f0776d31387b706514f2169eb936d57e598cd5ea3cce2e493379717da"
  why_pointer: ""
  scope: ["security"]
  enforcement:
  - {"kind": "test", "ref": "tests/security/test_production_posture.py", "note": "session store keystore only"}
  - {"kind": "test", "ref": "tests/security/test_secure_defaults.py", "note": "shipped config defaults only"}
  severity: "high"
  owner: "session"
- id: "security_by_design.principles.defense-in-depth"
  anchor: "security_by_design/principles#3"
  source: "CLAUDE.md"
  text: "DEFENSE-IN-DEPTH: multiple INDEPENDENT locks on every dangerous door, so no single mistake opens it. One lock is a design smell — and a lock that is only a side effect of another scope's wiring is not an independent lock, it is one lock wearing two hats. Never assert a lock COUNT here; counts rot the moment a ceremony runs. Read the live locks per scope from default.toml + docs/runbooks/."
  text_sha256: "b5dcf538b80e805295d3c57825563d4d5a78b76ccd2ac1c90457a08cad7fdbaa"
  why_pointer: ""
  scope: ["security"]
  enforcement:
  - {"kind": "none", "ref": ""}
  severity: "high"
  owner: "session"
- id: "security_by_design.principles.deny-by-default"
  anchor: "security_by_design/principles#2"
  source: "CLAUDE.md"
  text: "DENY-BY-DEFAULT: allowlists, never blocklists. An empty allowlist denies everything. New capability starts denied and is explicitly granted, never started open and restricted later."
  text_sha256: "bf4f2cd738e7b6bf609caaf2e4da5cd2695408b3744fbad8d3c705965ef1d7b3"
  why_pointer: ""
  scope: ["security"]
  enforcement:
  - {"kind": "test", "ref": "tests/security/test_egress_screen.py", "note": "egress allowlist only"}
  severity: "high"
  owner: "session"
- id: "security_by_design.principles.every-control-is-tested-off"
  anchor: "security_by_design/principles#12"
  source: "CLAUDE.md"
  text: "EVERY CONTROL IS TESTED OFF: a lock ships with a test proving it BLOCKS when engaged and a toggle-test proving the probe FAILS when the lock is off — otherwise you cannot distinguish \"secure\" from \"test can't reach it.\""
  text_sha256: "27ebfb56e6b2bf5a426b734e6ea56647fab674a82210ebf2539a667b1899c4bb"
  why_pointer: ""
  scope: ["security", "tests"]
  enforcement:
  - {"kind": "reviewer", "ref": ".claude/agents/adversarial-reviewer.md", "note": "attack #3: locks that certify more than they test"}
  - {"kind": "test", "ref": "tests/security/test_instrument_toggles.py", "note": "instrument controls only"}
  severity: "high"
  owner: "session"
- id: "security_by_design.principles.fail-closed"
  anchor: "security_by_design/principles#1"
  source: "CLAUDE.md"
  text: "FAIL-CLOSED: every error path denies. A component that cannot verify its precondition refuses to start/act — it never proceeds hopefully. No fail-opens, ever; a discovered fail-open is a defect to fix immediately."
  text_sha256: "239eb75feb2ba58084d9192b8c47ba04efe9c185d4175a0e10d353853be892b9"
  why_pointer: ""
  scope: ["security"]
  enforcement:
  - {"kind": "test", "ref": "tests/security/test_egress_screen.py", "note": "egress screen only"}
  severity: "high"
  owner: "session"
- id: "security_by_design.principles.fail-loud"
  anchor: "security_by_design/principles#11"
  source: "CLAUDE.md"
  text: "FAIL-LOUD: a security control that degrades silently is worse than none. Silent skips, swallowed errors, and quiet fallbacks in a control path are defects."
  text_sha256: "a859f1639d09cbe301aa081293ac68e510412e70228f658396888e2126b8eec9"
  why_pointer: ""
  scope: ["security"]
  enforcement:
  - {"kind": "none", "ref": ""}
  severity: "high"
  owner: "session"
- id: "security_by_design.principles.hardware-rooted-integrity"
  anchor: "security_by_design/principles#10"
  source: "CLAUDE.md"
  text: "HARDWARE-ROOTED INTEGRITY: signed manifests verified at boot; a component that cannot verify what it is loading refuses to load it."
  text_sha256: "c2ad4e08fd052e4fb08f3f6e1edcb201ed339e3f20f5920d63f2adbb19b2d484"
  why_pointer: ""
  scope: ["security"]
  enforcement:
  - {"kind": "test", "ref": "tests/security/test_production_posture.py", "note": "signed-manifest posture pin only"}
  severity: "high"
  owner: "session"
- id: "security_by_design.principles.irreversible-ceremony"
  anchor: "security_by_design/principles#13"
  source: "CLAUDE.md"
  text: "IRREVERSIBLE = CEREMONY: any posture flip, first egress, or capability go-live is an LA-present event. Nothing irreversible happens autonomously."
  text_sha256: "38b49e164b97f12926f994fff41078a7eeb7a7e228cd13b10bafc7baf986bbad"
  why_pointer: ""
  scope: ["security"]
  enforcement:
  - {"kind": "none", "ref": ""}
  severity: "high"
  owner: "session"
- id: "security_by_design.principles.isolation-scaled-to-the-input"
  anchor: "security_by_design/principles#9"
  source: "CLAUDE.md"
  text: "ISOLATION SCALED TO THE INPUT: unbounded attacker-shaped input (arbitrary pasted pages, ADR-030 §3) parses in the guest VM across vsock, never host-side. A capped, authenticated response from one allowlisted host parses host-side under byte caps, provenance-tagging and the Layer-3 lock — a bounded contract is a different risk class, defended in depth rather than by isolation. Reach for isolation when an input's STRUCTURE is unbounded, not merely because it is untrusted."
  text_sha256: "ca8b59db0e13150eb5bf6a8f4c569a1a2b684b2132a673bf3b4372cd9704259b"
  why_pointer: ""
  scope: ["security"]
  enforcement:
  - {"kind": "none", "ref": ""}
  severity: "high"
  owner: "session"
- id: "security_by_design.principles.least-data-across-boundaries"
  anchor: "security_by_design/principles#8"
  source: "CLAUDE.md"
  text: "LEAST DATA ACROSS BOUNDARIES: metadata-only on the wire where possible; size caps; content crosses a trust boundary only when the feature is impossible without it."
  text_sha256: "5f420fa2997eae5025f6725361a2492bb9b0a34057b90717a9d1ea186980b2fa"
  why_pointer: ""
  scope: ["security"]
  enforcement:
  - {"kind": "none", "ref": ""}
  severity: "high"
  owner: "session"
- id: "security_by_design.principles.single-adjudication-door"
  anchor: "security_by_design/principles#5"
  source: "CLAUDE.md"
  text: "SINGLE ADJUDICATION DOOR: every risky action flows through the ONE Policy-Agent gate. Never add a side door, a bypass, or a second adjudicator."
  text_sha256: "942954647f674746ff4d77cf84a04d3b9f297671077ebe6fb08c0fb823ad0601"
  why_pointer: ""
  scope: ["security", "tests"]
  enforcement:
  - {"kind": "test", "ref": "tests/security/test_the_door_refuses_a_verdict_it_does_not_know.py", "note": "door verdicts only"}
  severity: "high"
  owner: "session"
- id: "security_by_design.principles.structural-absence-over-configuration"
  anchor: "security_by_design/principles#4"
  source: "CLAUDE.md"
  text: "STRUCTURAL ABSENCE over configuration: the strongest dormancy is code that ISN'T THERE — an adapter not registered, a flag with no code path to flip. Prefer structural severance to vigilance; a disabled flag alone is the weakest form."
  text_sha256: "0f6ea67bcf5cf8951bf905a2e25612d9f335e06519e6139655d792f1b04f7f27"
  why_pointer: ""
  scope: ["security"]
  enforcement:
  - {"kind": "none", "ref": ""}
  severity: "high"
  owner: "session"
- id: "security_by_design.principles.validate-before-trust"
  anchor: "security_by_design/principles#7"
  source: "CLAUDE.md"
  text: "VALIDATE BEFORE TRUST: anchored input validation (exact-format id gates, action allowlists) BEFORE any store or gateway is consulted — a forged request dies at the boundary. Untrusted content is provenance-tagged and datamarked; it never gains instruction authority."
  text_sha256: "16f07ac64193d816e77a3f138c4a950a61c485dcf9090d397cfd127a2b18016e"
  why_pointer: ""
  scope: ["security"]
  enforcement:
  - {"kind": "test", "ref": "tests/security/test_purpose_unforgeable.py", "note": "purpose binding only"}
  severity: "high"
  owner: "session"
- id: "session_start_protocol.after_confirmation.execute-the-full-arc"
  anchor: "session_start_protocol/after_confirmation#1"
  source: "CLAUDE.md"
  text: "Execute the full arc (see autonomy) without further permission-seeking — the mid-arc escalations REQUIRED by decision_boundary are not permission-seeking and remain mandatory."
  text_sha256: "3f8b04524f54bda1dfe49fd9d2ac2cf0d04c2460b3a3945030f46524f9e821f6"
  why_pointer: ""
  scope: ["process"]
  enforcement:
