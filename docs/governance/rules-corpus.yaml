  severity: "normal"
  owner: "session"
- id: "decision_boundary.deferral_discipline.any-review-audit-verification"
  anchor: "decision_boundary/deferral_discipline#1"
  source: "CLAUDE.md"
  text: "Any review/audit/verification pass that returns findings gets a DISPOSITION RECORD — `docs/reviews/<topic>-disposition-<date>.md` with a machine-checkable ```disposition block, one row per finding, FIXED (commit-ish evidence) / DEFERRED (#ticket + `blocked-by:` predicate) / REJECTED (argued, not asserted). Run the verifier before you report the work done."
  text_sha256: "a0d7437b36438c04ef8fd233cbb3c4b46d95bcca0e72857a780b4aa821e79eda"
  why_pointer: ""
