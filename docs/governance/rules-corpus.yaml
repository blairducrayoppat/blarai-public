  source: "CLAUDE.md"
  text: "Leaking the workshop into the product: writing network calls / cloud dependencies / Claude-side assumptions into runtime code because \"we have internet here.\" BlarAI's restrictions bind everything that SHIPS."
  text_sha256: "77c8d39c06d41cc8ca7dc267f210b3c18129863f719c09a4d8adca45f4eb8cb1"
