  owner: "session"
- id: "vikunja.shipping-closes-the-ticket-non-negotiable"
  anchor: "vikunja#2"
  source: ".claude/rules/vikunja.md"
  text: "Shipping closes the ticket (non-negotiable): the merging agent closes the ticket with a one-line comment citing the shipping SHA, in the same motion as the merge. Live capability + open ticket = incomplete ship. Partial landings: dated \"CURRENT STATE (YYYY-MM-DD)\" top comment with built-vs-remaining + evidence."
  text_sha256: "61e45af5941d539e4f93fd0b8399ac64cfc03816afa5564c9369937e643d0583"
  why_pointer: ""
  scope: ["git", "vikunja"]
