  severity: "normal"
  owner: "session"
- id: "vikunja.the-board-is-what-he-reads"
  anchor: "vikunja#7"
  source: ".claude/rules/vikunja.md"
  text: "The board is what he reads: a stale board is misinformation delivered to the person steering."
  text_sha256: "8ddbe393d743ae8daed243c5dc03e18dd87361b68f9d3f9affc8833783460c8b"
  why_pointer: ""
