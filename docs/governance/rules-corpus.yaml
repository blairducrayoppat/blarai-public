  anchor: "identity_split/rulebooks#1"
  source: "CLAUDE.md"
  text: "BlarAI runtime: highly restricted. No longer totally air-gapped, but every network door is deliberate, policy-gated, deny-by-default behind multiple locks, opened only via LA-present ceremony. Fail-closed; zero tolerance for leakage."
