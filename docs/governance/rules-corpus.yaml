  anchor: "journal_discipline#1"
  source: "CLAUDE.md"
  text: "Every substantive ship requires a journal entry — same commit or same-day follow-up. \"Write it later\" never happens. Never ask whether to write the journal; it is required finishing work. Pure mechanical commits (typos, formatting, no-behavior dep bumps) are exempt."
  text_sha256: "3bda51e52add4ef535448302be479db7f1aa70c39794a4848ae3616f950f0f04"
