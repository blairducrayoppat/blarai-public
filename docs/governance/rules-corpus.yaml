- id: "journal_discipline.lesson-curation"
  anchor: "journal_discipline#7"
  source: ".claude/rules/journal.md"
  text: "Lesson curation: search LESSONS.md's hot index + Canonical Tier before minting a number; recurrence → dated tally on the lesson's full text in the archive volume + bump its ↺ flag on the index line; THIRD instance MUST ship a structural control (gate test / CI check / hook) in the same change. Mechanics → FIELD_NOTES.md; transferable judgment → the lesson. Quarterly consolidation pass next due 2026-10-01."
