  severity: "normal"
  owner: "session"
- id: "identity_split.facts.blarai-the-artifact"
  anchor: "identity_split/facts#1"
  source: "CLAUDE.md"
  text: "BlarAI = the artifact: local-execution-only AI system on his hardware, own model, own trust spine, own governance. Claude is NOT part of the BlarAI runtime and never becomes part of it."
  text_sha256: "af7c41f9c9acd2ed8d6024b40aed28a15cffce90d497562c475acfcc5a489680"
