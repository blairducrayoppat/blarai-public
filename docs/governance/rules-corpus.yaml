  severity: "normal"
  owner: "session"
- id: "host_environment.powershell-7-primary-shell"
  anchor: "host_environment#3"
  source: "CLAUDE.md"
  text: "PowerShell 7 primary shell. Elevated vs non-elevated matters (3 symlink tests skip non-elevated — benign). Overnight/scheduled GPU work MUST launch via elevated Scheduled Task — hand-launched consoles strand on UAC. Forward slashes in tool-call paths (avoid \\u escapes)."
  text_sha256: "775e35254205e870e21c78cf72e89cee43daebc35224c989d0d5a487a711222b"
  why_pointer: ""
  scope: ["tests"]
  enforcement:
