- id: "stack.model-upgrade-watch"
  anchor: "stack#1"
  source: "CLAUDE.md"
  text: "Model-upgrade watch: Qwen3-14B stays. Swap is blocked on the OpenVINO substrate, revisited only on the two named signals in the watch record. Do not propose swaps as routine improvement."
  text_sha256: "a4e8738e9be25cd7bd49bc26203df9abfb3a5b2b93a7432a3bbdc9de29f52216"
  why_pointer: ""
