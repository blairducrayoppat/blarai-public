- id: "decision_boundary.deferral_discipline.the-trigger-is-momentum-not-laziness"
  anchor: "decision_boundary/deferral_discipline#3"
  source: "CLAUDE.md"
  text: "The trigger is MOMENTUM, not laziness: the change merged, the box feels closed, and leftovers get ticketed to keep it feeling finished. Filing a ticket is not disposal; a ticket filed to stop thinking is a dropped finding wearing a queue entry. Watch for it hardest right after a merge, after a long arc, and when about to report success."
  text_sha256: "36e27d679603d16a570230062e6fa2c74bff9708d895bdcaa5b5ff3840c70b1c"
