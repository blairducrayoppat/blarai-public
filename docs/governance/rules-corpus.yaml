- id: "session_start_protocol.grounding.the-clock"
  anchor: "session_start_protocol/grounding#0"
  source: "CLAUDE.md"
  text: "THE CLOCK. Read local wall-clock + timezone from the machine (`Get-Date -Format 'yyyy-MM-dd HH:mm:ss K'`). The harness's injected \"today's date\" is **UTC** — a different DAY from his evening. He changes timezone every few weeks, so a TZ he states outranks the machine's and always outranks a remembered one. Re-read before any staleness/overdue/stall/kill judgment: elapsed time is MEASURED, never narrated — a UTC-anchored gate mis-dates every figure it touches and the drift compounds for hours."
  text_sha256: "d94c23faf9f88cec2685e04eae368897a8782dbdc88e258984168b09bc88b1af"
  why_pointer: ""
  scope: ["process", "tests"]
  enforcement:
