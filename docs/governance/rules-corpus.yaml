- id: "stack.app-layer"
  anchor: "stack#2"
  source: "CLAUDE.md"
  text: "App layer: Python 3.11 services (shared/, services/, launcher/; both venvs are 3.11.9). WinUI 3 C# desktop app is the primary face — build with `-p:Platform=x64` (bare AnyCPU fails): it writes the base-folder exe the launcher and WinUI harness run; adding `-r win-x64` writes only a `win-x64/` subfolder neither runs. Textual TUI predates it. SQLite sessions/knowledge, born-encrypted at rest, secure-delete on."
  text_sha256: "a68cce5c449378f4708e335fc87e302e27d1a276ef716cf403873fcc51c8431b"
  why_pointer: ""
  scope: []
  enforcement:
