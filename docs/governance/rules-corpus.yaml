  owner: "session"
- id: "git_discipline.merge_guards.branch-gate-green-before-merge"
  anchor: "git_discipline/merge_guards#1"
  source: "CLAUDE.md"
  text: "Branch gate-green BEFORE merge; gate re-run on merged main AFTER (the merge itself can break what both parents passed)."
  text_sha256: "f23c47d1ad48d076c320f37b7d6e7a875b17a445d27dd695259b02dd823a7f55"
  why_pointer: ""
