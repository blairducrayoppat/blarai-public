- id: "stack.toolchain-hygiene"
  anchor: "stack#4"
  source: "CLAUDE.md"
  text: "Toolchain hygiene: build/conversion toolchains (diffusers, torch) in a SEPARATE venv, never in the runtime .venv. Dev-side installs pre-approved; runtime dependencies are not."
  text_sha256: "36600c8df7ab4ccdbb013d0479b37e383b1281d58aa81cafa4c60e4aa99d95d4"
  why_pointer: ""
  scope: []
  enforcement:
