  severity: "normal"
  owner: "session"
- id: "vikunja.lifecycle"
  anchor: "vikunja#3"
  source: ".claude/rules/vikunja.md"
  text: "Lifecycle: before starting → set \"Doing\" + comment. Complete → complete_task + results comment. Failure → comment with summary, do NOT mark complete. Umbrella/epic tickets close when the last in-scope limb lands; new residuals get their own tickets."
  text_sha256: "ed6779107bbdebe43b7956f26dab2ee36b92d735f270f20393e1bb67528f044f"
  why_pointer: ""
  scope: ["vikunja"]
  enforcement:
  - {"kind": "none", "ref": ""}
  severity: "normal"
  owner: "session"
- id: "vikunja.session-start"
  anchor: "vikunja#1"
  source: ".claude/rules/vikunja.md"
  text: "Session start: `project_summary`. Use the mcp__vikunja__* MCP tools directly; he uses the webUI for manual work."
  text_sha256: "c555a554ab525cf723e1d2f31f846dda37543bf77e803490417490a9f9fecd7c"
  why_pointer: ""
