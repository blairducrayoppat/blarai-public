  text: "Register discipline (LA 2026-08-17, #1442): every rule is an imperative with a one-clause reason. Incident stories and dates go to docs/governance/agent-doctrine-evidence.md — appended in the same motion as the rule they justify — never inline in CLAUDE.md, .claude/rules/* or .claude/agents/*. Decision provenance and operational dates stay. Reserve emphasis for the few load-bearing rules; dense emphasis stops carrying information."
