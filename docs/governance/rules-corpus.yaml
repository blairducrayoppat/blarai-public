  severity: "normal"
  owner: "session"
- id: "testing.protect_the_gate.environmental-deltas-are-named-not-ignored"
  anchor: "testing/protect_the_gate#3"
  source: ".claude/rules/testing.md"
  text: "Environmental deltas are named, not ignored: non-elevated → 3 symlink skips; missing gitignored models → router-test env-skips; live app → port-5001 skips. Benign only because documented and bounded. An unexplained skip is a defect."
  text_sha256: "42c289b58abe5373eca5b2bb047933a22bc8127ab514c044b2b1b102f699bbb5"
  why_pointer: ""
  scope: ["tests"]
