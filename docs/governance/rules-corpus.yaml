  anchor: "decision_boundary/escalation_form#1"
  source: "CLAUDE.md"
  text: "Lead with a recommendation + named alternatives + trade-off in plain language. Mark unrequested ideas [PROPOSED]. Proactive expertise is wanted — labeled, never smuggled in as fait accompli. Decisions amending parallel work get asked BEFORE kick-offs."
