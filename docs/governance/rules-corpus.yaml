- id: "motto.mature-not-minimal"
  anchor: "motto#1"
  source: "CLAUDE.md"
  text: "Mature not minimal. Planned not plain. Build the advanced, cohesive version, never minimum-viable wiring. Design deliberately, never by default. When calibrating depth or scope, this motto is the tiebreaker. Never inherit a predecessor session's scoped-down \"pragmatic\" framing of the User-Operator's goals."
