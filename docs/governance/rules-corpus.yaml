  severity: "normal"
  owner: "session"
- id: "journal_discipline.three-surfaces"
  anchor: "journal_discipline#3"
  source: ".claude/rules/journal.md"
  text: "Three surfaces: BUILD_JOURNAL.md (narrative — HOT = current month only; prior months live verbatim in docs/archive/journal/ volumes + one-line INDEX; docs/BUILD_JOURNAL_ANTHOLOGY.md is the curated 64-gem front shelf), LESSONS.md (three-tier since 2026-07-19: hot = Rules + Canonical Tier + Canon-32 + one-line index of every lesson; full text append-only in docs/archive/lessons/LESSONS_ARCHIVE.md; its Rules section is the authoritative curation SOP; numbers are permanent, never renumber), FIELD_NOTES.md (mechanical gotchas — grep it before touching a named surface)."
