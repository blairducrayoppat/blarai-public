  severity: "normal"
  owner: "session"
- id: "journal_discipline.every-meaningful-governance-decision"
  anchor: "journal_discipline#2"
  source: "CLAUDE.md"
  text: "Every meaningful governance decision = ADR + journal entry naming the trade-off + DECISION_REGISTER.md row IN THE SAME CHANGE."
  text_sha256: "f8080c6243cc299a0fbe3180b1b0bbf5911751bf0ea2e66114c62588da6bbd9c"
  why_pointer: ""
  scope: ["journal"]
  enforcement:
