- id: "decision_boundary.deferral_discipline.honest-limit"
  anchor: "decision_boundary/deferral_discipline#4"
  source: "CLAUDE.md"
  text: "Honest limit: the gate checks the FORM of a record that exists; it cannot see a review whose findings were never written down. That gap is closed here, by you, not by the script."
  text_sha256: "23709c9c42cc3860da3f14ce1959d15ae88338825d2c1843995840b0e4688301"
