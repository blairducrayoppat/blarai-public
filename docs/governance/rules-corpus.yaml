  owner: "session"
- id: "journal_discipline.monthly-retrospective"
  anchor: "journal_discipline#8"
  source: ".claude/rules/journal.md"
  text: "Monthly retrospective: at each month's end (or first quiet tree after), one session writes a `### YYYY-MM-DD — Monthly retrospective: <arc title>` entry — the wide shot that makes the arc legible. The SAME session runs the rotation (tools/doc_hygiene/rotate_log.py): prior month → its docs/archive/ volume + INDEX line-batch (journal now; PERFORMANCE_LOG once its rotation ships), and promotes any new gems into the anthology."
  text_sha256: "8f7c57e262e43090658a9cc0d85780f258027ac5515c390bf5464b839e8162fb"
  why_pointer: ""
