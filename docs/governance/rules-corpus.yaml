- id: "journal_discipline.anti-patterns-forbidden"
  anchor: "journal_discipline#5"
  source: ".claude/rules/journal.md"
  text: "Anti-patterns (forbidden): vague entries with no measurement/trade-off/lesson; changelog bullets as narrative; trade-off-free entries; sanitized entries hiding the failure path; status-shaped entries (no failure, no trade-off, no lesson → belongs in the ledger, not the journal); minting a lesson number without searching LESSONS.md first."
  text_sha256: "fb4b426b55ec541f77c5db782be5d7425dc8b9b4b32da09554f4902130d287e4"
  why_pointer: ""
  scope: ["journal"]
  enforcement:
