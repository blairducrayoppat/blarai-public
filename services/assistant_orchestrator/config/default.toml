# Increment-2 swap: pre-load headroom gate — GiB of free RAM required after BlarAI
# fully steps aside, before the 30B is loaded.
#
# 19 GiB — LA DIRECTIVE 2026-08-07 (#1313), NOT a measurement. The 20 GiB floor was
# refusing coder dispatches; the LA accepted the risk of a lower one. No supervised
# load has been run AT 19.
#
# Scope that claim precisely — an earlier draft of this comment overstated it. 19 is
# below the lowest ambient at which a SUPERVISED, POST-STEP-ASIDE load (the shape this
# gate actually measures) has been recorded: #777, 2026-07-09, OpenVINO GenAI 2026.2.1,
# warm compile cache — READY in ~13s from a 19.85 GiB ambient with NO page storm
# (Available floor 4.6 GiB, ~10s of weight staging only), zero gate-step slowdown under
# the post-load squeeze, normal generation after. That is the 20.0 setting's evidence,
# and this setting is 0.85 GiB under it. Before that, 21 matched start-llm's gate and
# the 2026-06-21 era (OV 2026.1.0, lowest observed success 23.1 GiB) — a dataset that
# never TESTED below 23.1.
#
# It is NOT true that no 30B load has ever succeeded below 19.85. #784's live probe
# (docs/performance/probe_livecheck_2026-07-10.json, condition `co_resident_artifact`)
# reached READY from a 9.83 GiB ambient with the 14B STILL RESIDENT — in 34.8s rather
# than 15.5s. That run is not representative (wrong certs root, so the AO was never
# stopped) and must not be read as licence to lower this gate further. But it is the
# most relevant thing anyone has measured about the failure MODE, and it argues FOR the
# directive rather than against it: under headroom pressure this substrate degrades —
# it stages slower — rather than hard-failing.
#
# What backstops the unmeasured margin: the 480s load deadline and THIS gate's
# GRACEFUL abort (restores the 14B). A too-thin floor costs a failed dispatch, not a
# wedged box. The COLD-load caveat #777 carried still applies and is now larger — a
# post-OVMS-upgrade (#747 class) load stages more than the warm run measured.
#
# Keep in lockstep with start-llm's $needGB and the battery lean-preflight
# ($LEAN_GATE_GIB = this + 0.5). Tunable without a code change; tests/security/
# test_swap_floor_enforced.py proves the driver actually REFUSES below this value
# rather than merely storing it.
swap_min_free_gb = 19.0

# Problem-2 (#670): out-of-band OVERALL-run budget (seconds). A watchdog in the detached
# swap driver force-kills a wedged run-fleet child and tears down to restore the 14B if the
# whole task loop exceeds this — the backstop for a hung/over-long coding task that would
# otherwise strand the 30B resident (the live failure this fix closes). A value <= 0
# DISABLES the watchdog (full back-compat).
# #757 (night-2, 2026-07-07): the old 5400 s (90 min) ceiling was sized to pre-plan-graph
# runs (~50 min for 8-9 tasks); a 5-task battery job's BUILDS alone measured 74-79 min
# (B4/B6 journals), so the budget tree-killed the final acceptance-tests task mid-candidate
# and the job oracle never ran. 10800 s (3 h) gives the measured build phase + a full
# worst-case acceptance task real headroom; run-fleet's idle-detection and the per-task
# ceiling (swap_ops.TASK_TIMEOUT_S) remain the wedge defenses — this is an abort bound,
# not a wait: healthy runs still finish in ~45-95 min.
swap_run_budget_s = 10800.0

