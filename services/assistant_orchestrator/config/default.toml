# Vikunja project ids the read surface reports on, keyed by a DISPLAY NAME — ids are
# NEVER hardcoded elsewhere (ADR-039 §2.12.11: every Vikunja id is name-resolved at
# runtime, so a re-migrated or per-installation project set needs no code change).
# Empty by default; an operator populates this after running the SEPARATE,
# operator-run Kanban substrate-setup migration script
# (tools/dispatch_harness/coordinator_setup.py — discover-or-create, never run by
# BlarAI itself). TOML inline-table form, e.g.:
#   projects = { "Coder Jobs" = 7 }
# The coordinator's observation scope (display name → Vikunja project id; ids
# resolved by the operator, never hardcoded downstream — ADR-039 §2.12.11).
# Set 2026-07-14 with the #749 bridge flip: the heartbeat's shadow cycles
# observe the coder-jobs board the bridge writes.
projects = { "Coder Jobs" = 12 }
# An optional path to a battery-campaign-state JSON file (tri-state read —
# shared/fleet/work_state.read_campaign_state). Empty (the default) reads as a benign
# EMPTY, never a failure: no campaign-state file with a stable schema is produced
# inside the BlarAI tree today (the battery harness's campaign bookkeeping lives
# partly in the sibling agentic-setup install) — point this at whatever your own
# install actually writes, if anything.
battery_campaign_state_path = ""

[security]
fail_closed = true
dev_mode = false
# capabilities(security.jwt_ca_cert_path):
#   pa-jwt-signature-validation = shared/crypto/jwt_validator.py::AgenticJWTValidator
jwt_ca_cert_path = "certs/pa_public.pem"   # ADR-021: PA JWT public key (ceremony-generated, per-chip, gitignored)
# FUT-04 / ADR-018: TPM-signed manifest verification.  Dormant default is false;
# enabling it requires the LA's provisioning ceremony to have run first.
# With false: missing .sig is permitted (WARNING emitted); present-but-invalid .sig
# is still FAIL-CLOSED.  With true: missing OR invalid .sig blocks boot entirely.
# capabilities(security.require_signed_manifest):
#   weight-manifest-signature-verification = shared/models/manifest_signer.py::verify_manifest_signature
require_signed_manifest = true
# FUT-05 / ADR-018 / #107: TPM-signed verification of the SPECULATIVE-DECODING
# DRAFT manifest, kept SEPARATE from require_signed_manifest above because the
# draft is NON-AUTHORITATIVE — in spec-decode the draft only PROPOSES tokens the
# signed+verified 14B target re-verifies, so a tampered draft degrades SPEED, not
# output integrity. Threaded into the launcher's shared-pipeline build
# (build_shared_pipeline require_signed_draft) for the ONE draft the launcher
# actually verifies (DRAFT_MODEL_OV_PATH = qwen3-0.6b-pruned-6l). This flag lives
# ONLY in this (AO) config — the launcher reads it here; a copy in the PA config
# would be read by nothing. The PA standalone/fallback draft is out of scope (no
# verifier), tracked in #917.
# Dormant default (false): the draft is DIGEST-verified only (the .sig is NOT
# consulted; the digest is still enforced, so a tampered draft weight is caught) —
# boot-safe on an UNSIGNED draft. With true: a missing OR invalid draft .sig fails
# closed (parity with require_signed_manifest for the 14B).
# Enabling it (LA ceremony, after the 14B pattern): (1) stage+sign the 14B + this
# draft with the SAME BlarAI-Manifest-Signing key —
#   python -m shared.security.provision_manifest_signing_key; (2) verify on-chip;
#   (3) flip this to true. Enforcing this on a still-unsigned draft would break
# boot, which is exactly why it is a SEPARATE flag from the 14B's, flipped later.
# capabilities(security.require_signed_draft_manifest):
#   draft-manifest-signature-gate = shared/inference/shared_pipeline.py::build_shared_pipeline
require_signed_draft_manifest = true   # GO-LIVE 2026-07-18 (#107): flipped by 6fbfc67f after the draft was staged+signed on-chip; missing OR invalid draft .sig now blocks boot.

[ipc]
vsock_cid = 2
vsock_port = 5001
mtls_cert_path = "certs/orch_client.pem"
mtls_key_path = "certs/orch_client_key.pem"
ca_cert_path = "certs/ca.pem"
policy_agent_port = 5000
timeout_ms = 5000
# 65536 -> 262144 (#1152, 2026-07-29, ADR-031 amendment 1). A PLAN_RESULT for a real
# operator goal exceeded the 64 KB cap in production (65891 and 66938 bytes on two live
# runs): the plan SUCCEEDED and could not be delivered. ADR-031 rejected raising this for
# ARTICLE content — unbounded, untrusted, fetched from the internet — and that rejection
# STANDS for that case (bulk content still crosses out-of-band via the encrypted staging
# file). This raise covers a different payload class: BlarAI's OWN locally-generated
# planning metadata on the loopback+mTLS host channel. NOTE the plan's max_tasks/
# max_criteria caps bound CARDINALITY, not bytes — the goal and the operator's
# requirements have no length limit, so this is headroom over an observed worst case,
# NOT a proof the payload fits. The honest over-cap refusal in the AO PLAN handler is
# the control; if it ever fires, chunk the result (ADR-031 Am.1), do not raise again.
max_message_bytes = 262144

[organise_userdata]
# Moving files inside the operator's own data folder (#1568) -- the assistant's
# FIRST file surface, and the most dangerous tool in the set.
#
# DORMANT. This flag is the go-live switch and stays false until an LA-present
# ceremony. Moves ONLY: there is no delete, no overwrite and no copy anywhere in
# shared/governance/userdata_move.py, so those are absent rather than disabled.
# A destination collision REFUSES the whole request -- silent renaming is how a
# move tool loses a file.
#
# Dormancy is STRUCTURAL: with this false the AO registers neither the runner
# nor the rehearsal, so the registry body returns a notice and no path is ever
# resolved. Reversal is the flag plus a restart.
#
# Note the SECOND lock: every move is routed to simulate-first, which is itself
# dormant behind [simulate_first].enabled. Both must be true before a single
# file can be moved by the assistant.
#
# capabilities(organise_userdata.enabled):
#   organise-runner = services/assistant_orchestrator/src/tools.py::register_organise_userdata_runner
#   organise-validation = services/assistant_orchestrator/src/tools.py::parse_organise_args
#   organise-containment = shared/governance/userdata_move.py::resolve_within
#   organise-plan = shared/governance/userdata_move.py::plan_moves
#   organise-apply = shared/governance/userdata_move.py::apply_moves
#   organise-rehearsal = services/assistant_orchestrator/src/entrypoint.py::_rehearse_organise_userdata
#   organise-execution = services/assistant_orchestrator/src/entrypoint.py::_run_organise_userdata_tool
#   organise-dispatch-gate = services/assistant_orchestrator/src/entrypoint.py::organise_userdata_enabled
enabled = false

[curate_knowledge]
# Knowledge curation (#1567): erase or mark-as-saved the documents matching a
# selector, with `delete` always rehearsed first through simulate-first.
#
# DORMANT. This flag is the go-live switch and stays false until an LA-present
# ceremony. Erasure is IRREVERSIBLE -- secure_delete=ON zeroes the freed pages
# and ON DELETE CASCADE reaps each document's chunks and images.
#
# Note the dormancy is STRUCTURAL, not merely this flag: with it false the AO
# registers neither the tool's runner nor its rehearsal, so the registry body
# returns a notice and no code path reaches the knowledge bank. Reversal is the
# flag plus a restart.
#
# Note also the SECOND lock: erasing is routed to simulate-first, which is
# itself dormant behind [simulate_first].enabled. Both must be true before a
# single document can be erased by the assistant.
#
# capabilities(curate_knowledge.enabled):
#   curate-runner = services/assistant_orchestrator/src/tools.py::register_curate_knowledge_runner
#   curate-validation = services/assistant_orchestrator/src/tools.py::parse_curate_args
#   curate-rehearsal = services/assistant_orchestrator/src/entrypoint.py::_rehearse_curate_knowledge
#   curate-execution = services/assistant_orchestrator/src/entrypoint.py::_run_curate_knowledge_tool
#   curate-selector = services/assistant_orchestrator/src/knowledge_bank.py::select_docs_for_curation
#   curate-erase = services/assistant_orchestrator/src/knowledge_bank.py::delete_docs
#   curate-dispatch-gate = services/assistant_orchestrator/src/entrypoint.py::curate_knowledge_enabled
enabled = false

[simulate_first]
# Simulate-first as a FOURTH route outcome (#1548, ACCEPTED by the LA 2026-09-17
# against a recommendation to decline). An action runs as a dry run whose result
# the operator sees at the escalation prompt, before the real execution is
# approved.
#
# DORMANT. This flag is the go-live switch and stays false until an LA-present
# ceremony. Reversal is this flag plus a restart, restoring byte-identical prior
# behaviour.
#
# Note the second, independent lock: even with this true, a tool is routable only
# if it DECLARES a dry run (tools._SIMULATE_FIRST_TOOLS, EMPTY at merge), and
# web_search is barred outright (tools._SIMULATE_FIRST_BARRED) because a dry run
# of the only egress tool performs the egress it is meant to gate. Flipping this
# flag alone therefore changes nothing — which is the point.
# What flipping this does TODAY: the tool loop begins consulting the route above
# tools.execute. The dry-run EXECUTOR does not exist, so a routed tool is REFUSED
# rather than executed — fail-closed, because a tool reported as simulated and in
# fact executed is the inversion this outcome exists to prevent. With the
# declaring set empty, no live tool routes and behaviour is unchanged.
#
# capabilities(simulate_first.enabled):
#   simulate-first-route = services/assistant_orchestrator/src/tools.py::route_simulate_first
#   simulate-first-declaration = services/assistant_orchestrator/src/tools.py::declares_dry_run
#   simulate-first-dispatch-gate = services/assistant_orchestrator/src/entrypoint.py::simulate_first_enabled
enabled = false

[reference_corpus]
# Offline reference corpus (#1616) -- a read-only encyclopedia snapshot the
# assistant can quote instead of answering from the model's own memory.
#
# WHY IT EXISTS, measured rather than assumed. A 40-subject stratified probe
# against the resident Qwen3-14B: on 20 uniformly-random Wikipedia articles the
# model produced nothing usable for 16, and of the 11 most-read subjects it did
# attempt, 6 answers carried a confident error -- one a total fabrication with
# an invented director, cast and plot. The probe explicitly invited "I do not
# know", so that is the BEST case for honesty, not the typical one.
#
# DORMANT. This flag is the go-live switch and stays false until an LA-present
# ceremony. It is not the only lock: with it false the AO registers no
# search_reference runner at all, so the tool's registry body returns a
# deterministic notice and no store path is ever opened (structural absence,
# security principle 4). Flipping it with no db_path, a missing store, or a
# manifest that does not verify leaves the capability dormant with a loud log
# rather than serving unverified text.
#
# capabilities(reference_corpus.enabled):
#   corpus-open-verified = shared/corpus/reader.py::ReferenceCorpus
#   corpus-integrity-refuse = shared/corpus/reader.py::CorpusError
#   corpus-query-sanitise = shared/corpus/reader.py::fts_match_expr
#   corpus-tool-body = services/assistant_orchestrator/src/tools.py::_search_reference
#   corpus-runner-register = services/assistant_orchestrator/src/tools.py::register_search_reference_runner
#   corpus-runner = services/assistant_orchestrator/src/entrypoint.py::_run_search_reference_tool
#   corpus-embedder-bind = services/assistant_orchestrator/src/entrypoint.py::_embed_for_reference_corpus
#   corpus-provenance-tier = services/assistant_orchestrator/src/context_manager.py::Provenance
enabled = false

# Absolute path to the store built by tools/corpus/build_corpus.py. Empty
# resolves the same as disabled.
db_path = ""

# Integrity manifest for the store. The corpus is INTEGRITY-SIGNED, NOT
# ENCRYPTED (LA decision D1, 2026-09-21): the content is a public encyclopedia,
# so encryption buys no confidentiality and costs a decrypt on every read,
# while what the operator ASKED and what was RETURNED stay in the encrypted
# session store as they always have. A deliberate, scoped deviation from the
# born-encrypted default, recorded in ADR-023 Amendment 5. Empty resolves to
# the manifest the builder writes beside the store (<db_path>.manifest.json).
# A SHA-256 mismatch or a missing manifest makes the reader REFUSE to open --
# fail-closed; there is no setting that opens the store unverified.
manifest_path = ""
