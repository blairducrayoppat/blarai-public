# Assistant Orchestrator Configuration — Default Profile
# USE-CASE-004: Conversational Generation Engine
# Updated: ADR-011 — GPU inference (NPU retired from P1 Core Loop)
#
# CEREMONY-FLAG TRUTH CONVENTION (#1060, lesson 47; gate:
# tests/security/test_config_comment_truth.py). A flag flipped — or staged to
# be flipped — at an LA go-live ceremony carries, directly above its
# assignment line, a machine-checked declaration of the capabilities it gates:
#     capabilities(<section>.<key>):
#       <name> = <runtime-path>.py::<symbol>
# The gate resolves every entry against the real codebase (file + symbol must
# exist in runtime code) and fails the standing gate, by name, on a claim the
# code does not contain. English prose is NOT machine-verified — the
# declaration is the authoritative claim list; keep it true in the same
# change that changes what the flag gates.

[runtime]
deployment_mode = "host"

[service]
name = "assistant_orchestrator"
version = "0.3.0"
log_level = "INFO"

[gpu]
device = "GPU"                                     # ADR-011: All LLM inference on GPU (Arc 140V)
model_dir = "models/qwen3-14b/openvino-int4-gpu"  # ADR-012: Qwen3-14B INT4
weight_manifest = "models/qwen3-14b/openvino-int4-gpu/manifest.json"  # ADR-012
draft_model_dir = "models/qwen3-0.6b-pruned-6l/openvino-int8-gpu"  # pruned 6-layer INT8 draft -- streams incrementally (chosen 2026-05-22)
speculative_decoding_enabled = true                         # ADR-012 §2.6
max_context_tokens = 16384                         # DEC-03
priority = 1                                       # DEC-AO priority=1 (MEDIUM hint)
# KV-cache precision hint (OpenVINO 2026.2 GPU INT4/INT8 KV-cache quantization).
# Empty = unset = runtime default (FP16) — zero change from today. On the Arc 140V
# (XMX) this is opt-in, so it engages ONLY when set. A Session-2 memory/quality A/B
# knob (e.g. "u8" or "u4"); leave empty until measured.
kv_cache_precision = ""

# --- BRAIN SWITCH (#930) --------------------------------------------------
# Which model serves as the resident brain for BOTH the Policy Agent and the
# Assistant Orchestrator. EMPTY = the compiled-in Qwen3-14B above, which is
# the shipped default and the only configuration that has been through a
# go-live ceremony. Boot is byte-identical while this is empty.
#
# Setting it selects a different brain. The DRAFT model is NOT configured
# here: whether speculative decoding applies is a property of the model's
# LAYOUT, decided from the files on disk. A natively multimodal export
# (Qwen3.6-35B-A3B, Gemma 4) is served through VLMPipeline, which has NO
# speculative decoding at all — measured 2026-09-22, the 35B still runs 2.4x
# faster than the 14B WITH its draft, because ~3B of its parameters are
# active per token.
#
# Requirements before setting this, each fail-closed at boot:
#   - the directory must exist (a set-but-missing path REFUSES to boot rather
#     than falling back to the 14B silently)
#   - manifest.json must be present, TPM-signed, and cover every weight binary
#     (stage with scripts/stage_model_manifest.py, then
#     shared.models.manifest_signer.sign_manifest — an operator ceremony)
#
# Flipping this is a CAPABILITY + QUALITY change and an ADR-012 amendment:
# it is an LA-present go-live decision, not a config tweak.
# capabilities(gpu.brain_model_dir):
#   brain-override-read = launcher/__main__.py::_resolve_brain_override
#   brain-layout-detect = shared/inference/shared_pipeline.py::detect_brain_layout
#   brain-pipeline-build = shared/inference/shared_pipeline.py::build_shared_pipeline
#   brain-weight-integrity = shared/models/weight_integrity.py::verify_all_manifest_entries
#   brain-manifest-signature = shared/models/manifest_signer.py::verify_manifest_signature
brain_model_dir = ""

[generation]
max_new_tokens = 4096
temperature = 0.0
top_k = 50
top_p = 0.9
repetition_penalty = 1.1
do_sample = false
# min_p nucleus floor (OpenVINO GenAI 2026.2). Drops low-probability tokens
# (p < min_p × p_max) before sampling; only affects do_sample=true runs.
# 0.0 = disabled (default; preserves current behaviour). A Session-2 A/B knob
# for answer quality — leave at 0.0 until measured.
min_p = 0.0
# Grammar-constrained tool calls (#718 — xgrammar triggered structural tags,
# OpenVINO GenAI structured output). true: free text is unaffected, but the
# moment the model emits the <tool_call> trigger the decoder is constrained
# to a schema-valid {"name": <registered tool>, "arguments": <typed args>}
# body — a malformed or unknown-tool call is structurally impossible at the
# decoder. Verified offline to compose with speculative decoding + streaming
# (probe 2026-07-01) and live once (2026-07-02, 4.8s tool turn).
# OFF since 2026-07-02 (LA decision revising D2, #718): a LIVE xgrammar
# crash killed a real tool turn at the stop-token boundary under
# spec-decode — grammar_matcher.cc:627 "GrammarMatcher has terminated after
# accepting the stop token, but is trying to find the next token mask"
# (GenAI 2026.2.1). Fail-closed generation error; no output corruption.
# Tracked + upstream report: Vikunja #725. Do NOT re-enable before the
# runtime fix lands and the #725 revisit criterion passes.
# false = parse-time validation only: the model still emits native JSON
# (trained format) and tools.parse_tool_call's strict parse + schema
# validation (fail-closed) remains the guard.
tool_call_grammar = false
response_depth_mode = "standard"   # concise | standard | detailed

# [preemption] and [circuit_breaker] were REMOVED 2026-09-20 (#1582). Nothing read
# either section -- verified by AST over every config_data.get() call in the AO
# entrypoint -- and [circuit_breaker].max_tool_call_depth said 5 while the loop
# enforced 3. A settings file the operator reads is a governance surface: a
# number in it that nothing enforces is a false statement about what the system
# will do, and this one was wrong in the reassuring direction. The live caps are
# shared/constants.py MAX_OUTPUT_TOKENS and MAX_TOOL_CALL_DEPTH. The preemption
# values survive as AO constants (see #1601 -- they have no production caller
# either).

[trust_spine_canary]
# #1584 - prove the adjudication doors are ALIVE, not merely not-yet-denying.
# A fail-closed door that never loaded is silent, and so is one that loaded
# and has had nothing to deny. At boot the canary submits one action each
# door MUST refuse and one each MUST allow, and logs what it established.
#
# It WRITES NOTHING: the egress probes adjudicate without recording, so no
# row is appended to the signed audit chain. It opens no door and renders no
# verdict of its own. On is the default because a canary that does not run
# is the silence it exists to break.
enabled = true

[pgov]
cosine_similarity_threshold = 0.85
# PII output policy: "off" | "block" | "redact". A local, single-user
# personal assistant exists to surface the user's own data back to them,
# so "off" is the correct production posture. "block" suppresses any
# response containing PII. "redact" surfaces PII traced to the user's own
# documents/messages and replaces untraceable (hallucinated/injected) PII
# with a visible marker -- see docs/governance/ for the rationale.
pii_mode = "off"
delimiter_echo_enabled = true
tool_allowlist_enabled = true
leakage_detection_enabled = true
embedding_model_path = "models/bge-small-en-v1.5/onnx-fp16/model.onnx"
# Layer 3 default posture (ADR-023, supersedes ADR-013). RE-ENABLED
# 2026-06-04 (Sprint 12 EA-3). The gate now fires ONLY when UNTRUSTED-
# provenance content is present (pasted external text, or a future
# web-fetch result). Trusted-local files and trusted-memory never trip
# it, so secure-by-default carries ZERO daily-driver friction — which is
# exactly why the ADR-013 pause (block on ANY loaded document) could be
# lifted. The full architecture remains (gate, /trust override, helpful
# inline message, audit logging). The 2026-05-26 /unload-restore bug is
# fixed by the provenance gate: /unload clears untrusted content and the
# subsequent trusted-memory retrieval can no longer re-trip the gate.
# Misconfiguration warning: when set false here, the AO emits a WARNING
# at startup so the non-secure default is visible in launcher.log.
# (Back-compat: the legacy key block_tools_when_documents_loaded is still
# read if this key is absent.)
block_tools_on_untrusted_content = true

[context]
spotlighting_enabled = true
max_history_turns = 20
max_context_tokens = 4096
# Session idle-reap TTL (Vikunja #801). Seconds a conversation may sit with NO
# turn activity before the AO destroys its in-RAM state (conversation context,
# KV-warm flag, /trust flag, user-documents flag, egress envelope). The audit
# found destroy_session had ZERO production callers -- every session since boot
# stayed resident until restart, unbounded for a "decades of use" process.
# Reaping is correctness-safe: the durable transcript lives in the gateway's
# encrypted session store, and a reaped session is lazily re-created + history-
# reseeded on its next prompt (FUT-07); the /trust flag re-derives from the
# request payload. The cost of a reap is one cold KV prefill on the next
# prompt, never data loss. 1800 s (30 min) is the LA-DECIDED value
# (2026-07-11, #801 c.1713 -- not a tunable design default): an idle
# conversation releases its RAM after 30 minutes; resume reloads from disk.
# The launcher threads this SAME value into the gateway's session-state
# reaper (pending documents, ingest previews, dispatch plans), so one knob
# bounds both processes. Set to 0 (or negative) to DISABLE reaping (the
# pre-#801 behaviour). Registered in shared/timeout_registry.py (gate-locked
# against drift; review path = operator-workflow telemetry).
session_idle_ttl_s = 1800

[substrate]
# Personal Knowledge Substrate (USE-CASE-002, ADR-016 / ADR-025) live-memory
# footprint control (Vikunja #611). The substrate decrypts every document/turn
# embedding ONCE into an in-RAM cache and, by default, holds it for the store's
# whole lifetime -- the largest and longest-lived plaintext-derived secret in
# RAM (embeddings are semantically invertible). When this many seconds pass with
# no retrieval, the cache is UNLOADED: its numpy buffers are zeroed in place
# (genuine overwrite -- numpy arrays are mutable, unlike the immutable-bytes DEK)
# and dropped, shrinking both the exposure window and the 32 GB memory footprint.
# The next retrieval re-decrypts the same rows lazily (a one-time re-decrypt cost
# on the first query after idle). Set to 0 (or negative) to DISABLE idle-unload
# and keep the cache resident for the store's lifetime (the pre-#611 behaviour).
# Default 900 s = 15 min. NOTE: the right default is the on-box reload-latency
# re-measure (see PERFORMANCE_LOG.md / docs/performance/); 900 s is the
# placeholder until that measurement lands.
embed_cache_idle_unload_s = 900

[embeddings]
# Inference device for the shared bge-small-en-v1.5 embedding model (#720) --
# substrate memory, the knowledge bank, and PGOV Stage-5 leakage detection all
# ride the ONE embedding session this selects.  "CPU" = the ONNX Runtime CPU
# path (the pre-#720 executor); "NPU"/"GPU" compile the SAME fp16 ONNX via
# OpenVINO on that device (a device knob, NOT a precision knob).  FAIL-SOFT:
# an OpenVINO compile failure logs EMBED_OFFLOAD_FALLBACK and falls back to
# the CPU path -- an offload optimisation never refuses to start (contrast
# the fail-closed check_leakage control itself).  ADR-011 retired the NPU
# from LLM DECODING only; encoder offload does not touch that decision.
# Default "NPU" set from the 2026-07-02 on-box measurement (PERFORMANCE_LOG.md
# + docs/performance/embedding_device_2026-07-02_00-10-26.json): vs the CPU
# path the NPU is 13.6x faster on document-window texts (168.9 -> 12.4 ms),
# 2.2x on batch-32, parity on short singles -- while freeing BOTH the P-cores
# and the (14B-contended) GPU. Warm boot compile ~2.5 s via the blob cache
# (%LOCALAPPDATA%/BlarAI/ov_cache/embeddings); a box without a working NPU
# falls soft to CPU automatically.
device = "NPU"

[knowledge]
# Knowledge bank (UC-002 Substrate v2, Vikunja #655) — the operator-curated,
# approval-gated encrypted store behind the UC-003 ingest flow. A SIBLING of
# substrate.db under the SAME DEK envelope (ADR-025 one-DEK rule), own DACL,
# own DATA_MAP row. Pending rows hold cleaned content only; APPROVE chunks +
# embeds + indexes; REJECT tombstones with content retained. Retrieval reads
# approved chunks ONLY and grounds them as UNTRUSTED_EXTERNAL regardless of
# stored provenance (ADR-023 / lesson 13). Feature-level fail-closed: a
# construction failure disables ingest + knowledge retrieval LOUDLY but never
# blocks AO boot (deliberate middle ground between the substrate's silent
# degrade and the session-store's refuse-to-start).
enabled = true
db_filename = "knowledge.db"
# Hybrid-retrieval budget (cosine + FTS5 BM25, reciprocal-rank fusion k=60).
retrieve_k = 4
# Knowledge-chunk embedding token window (bge-small native max 512). Bound to
# LeakageDetector.embed_documents — the 128-token leakage path is untouched
# (PGOV Stage-5 thresholds are calibrated there; byte-identical is a
# regression requirement).
embed_max_tokens = 512
# Byte cap enforced BEFORE reading an encrypted ingest staging file
# (%LOCALAPPDATA%\BlarAI\ingest_staging\<doc_uuid>.bin) — fail-closed refuse.
staging_max_bytes = 262144
# the 4th weld lock for UC-003 Workstream B (display-only images) — image fetch
# is dormant until this is flipped AND the egress door is opened (separate LA
# go-live ceremony).
# capabilities(knowledge.images_enabled):
#   image-ingest-binary-fetch = shared/security/guarded_fetch.py::fetch_external_binary
#   image-ingest-staging = shared/security/image_staging.py::write_staged_image
images_enabled = false

[web_search]
# #719 — the model-callable web_search tool (ADR-024 W4 LiveKagiAdapter).
# LIVE since the 2026-07-02 go-live ceremony
# (docs/runbooks/web_search_go_live.md): flag flipped with the DPAPI key
# provisioned and the ADR-027 allowlist activated (kagi.com sole entry, read
# by BOTH egress layers — the D4 tool-loop check and the guarded_fetch door).
# The AO registers the live runner at boot ONLY when this is true AND the
# operator-provisioned, DPAPI-sealed Kagi API key loads
# (%LOCALAPPDATA%\BlarAI\secrets\kagi_api_key.dpapi —
# `python -m shared.secrets.provision_kagi_key`); key absent/malformed →
# structurally dormant (the deterministic "unavailable" notice). RE-WELD:
# flipping this back to false (+ restart) is re-weld step 1 — the runner
# never registers. Steps 2 (empty the allowlist) and 3 (delete the key blob)
# are each independently sufficient; see the runbook.
# capabilities(web_search.enabled):
#   kagi-search-adapter = services/assistant_orchestrator/src/websearch/live_adapter.py::LiveKagiAdapter
enabled = true
# #727 — FAIL-CLOSED response-PARSE guard (security hardening; strengthen-only,
# no posture change). The live adapter decodes Kagi's HTTP reply with stdlib
# json.loads, which has NO size and NO recursion-depth limit; a pathological or
# man-in-the-middle'd response could resource-exhaust the host DURING parsing.
# These two ADDITIVE caps are validated BEFORE json.loads and, on violation,
# fail CLOSED to the deterministic "no results" (never a raise), logging WHY.
# They are a SECOND, INDEPENDENT lock DOWNSTREAM of the egress door's 8 MiB
# on-the-wire byte cap (shared/security/guarded_fetch.py _MAX_BODY_BYTES) — the
# door bounds what crosses the network; these bound what the adapter will PARSE
# — and are deliberately TIGHTER (a real Kagi v1 search reply is a few KB and
# nests ~5 deep). A missing OR invalid value falls back to the safe compiled-in
# default (live_adapter.DEFAULT_MAX_*), so the guard is NEVER silently disarmed.
#   max_response_bytes: reject a decoded response larger than this (2 MiB = 2*1024*1024,
#                       well under the 8 MiB door cap).
#   max_parse_depth:    reject JSON nested deeper than this many brace/bracket levels.
max_response_bytes = 2097152
max_parse_depth = 12

[egress]
# ADR-023 Amendment 4 (#723 rung 3) — the turn-scoped Windows-Hello egress
# envelope. The HUMAN consent layer in front of every model-initiated outbound
# tool call (web_search + any future egress tool). On the FIRST egress of a user
# turn a fingerprint fires showing the exact query; ONE touch covers up to
# `searches_per_fingerprint` (N) searches for that question; every subsequent
# query is disclosed live in chat as it leaves; exceeding N → a fresh
# fingerprint. Fail-closed (no verifier / timeout / cancel → the egress is
# refused and the turn ends with a clear message). This REPLACES the per-session
# /trust for egress tools; it runs IN ADDITION to the deterministic egress
# controls (the #570 PA RULE 3 + the kagi.com allowlist + the exfil screen),
# never instead of them.
#
# N = 1: a fingerprint on EVERY outbound query (#1594, decided 2026-09-19 when the
# LA delegated the call). It was 3 from 2026-07-02, and that decision was sound on
# its own terms — the tool loop is hard-capped at `_TOOL_LOOP_MAX = 3`
# (entrypoint.py), so N=3 did mean at most one fingerprint per turn while every
# query was still disclosed live in chat.
#
# What changed is the weight put on "disclosed" versus "approved". Chat disclosure
# is PASSIVE: it scrolls past whether or not anyone is at the screen. The
# fingerprint touch is the AFFIRMATIVE act, and under N=3 searches two and three
# rode on an approval given for a different string. An approval nobody gave is not
# an approval.
#
# The cost is real and bounded: a turn that chains three searches now asks three
# times instead of once. Relax path if the friction bites is raising N here — a
# posture LOOSENING, so it is the LA's call, not a session's.
searches_per_fingerprint = 1
# Bounded wait (seconds) for the operator's fingerprint answer; on expiry the
# egress is DENIED (fail-closed). Matches escalation_consent's default; a console
# operator answers in seconds — this is the wedged-surface backstop, not the path.
fingerprint_timeout_s = 120.0

[image_generation]
# UC-010 Local Generative Imaging (ADR-033) — local text->image + image+text->image
# on the Arc 140V via an uncensored SDXL-INT8 finetune (RealVisXL V5.0).
# Dormant default is enabled=false; the model is also gitignored, so on a checkout
# without weights is_available() is False and nothing loads regardless of the flag.
# Enabling it is a SEPARATE LA-present ceremony (one-time operator content
# attestation -> flip enabled -> verify LIVE on the GPU), never a runtime decision
# (ADR-033 §dormancy/go-live).
# Content safety is governance + the go-live attestation, NOT a classifier:
# uncensored for all LEGAL content; the immovable legal boundary is the
# operator's sole documented responsibility + a deliberate ACCEPTED-RISK
# (ADR-033 §content-safety).
# capabilities(image_generation.enabled):
#   text-to-image = shared/inference/image_gen.py::generate_text2image
#   image-to-image = shared/inference/image_gen.py::generate_image2image
enabled = true   # GO-LIVE 2026-06-16 (#666): flipped after VERIFIED TPM-signed manifest + the recorded content attestation (ledger 20260616_182807). require_signed_manifest stays true.
# ADR-023 Amendment 4 (#723 rung 2, DORMANT seam): bounded wait (seconds) for the
# operator's one-click answer on a per-generation-batch approval, on expiry DENIED
# (fail-closed). This gates only tools listed in tools._GEN_APPROVAL_TOOLS with a
# verifier registered; `generate_image` is a directive shim that points at
# /imagine (nothing to approve; lock-exempt), so it is not gated by this. Which
# tools are in that set is read from tools.py, never restated here.
tool_approval_timeout_s = 120.0
# Model-agnostic dir (a later checkpoint swap is config, not a rewrite).  The
# diffusers-OV INT8 layout (unet/ text_encoder*/ vae_*/ tokenizer*/ scheduler/
# model_index.json).  models/ is gitignored => the capability ships ABSENT.
model_dir = "models/sdxl-uncensored/openvino-int8-gpu"
# SHA-256 weight manifest verified at load (fail-closed; nested layout — every
# .bin AND .xml topology AND model_index.json is hashed + required, and any
# extra/unlisted one is rejected).  Staged at provisioning by
#   python -m shared.models.stage_production_manifest --nested   (BLARAI_MODEL_DIR=...)
# then SIGNED by shared.models.manifest_signer.sign_manifest (see
# require_signed_manifest below).  Runtime never fetches weights.
weight_manifest = "models/sdxl-uncensored/openvino-int8-gpu/manifest.json"
device = "GPU"          # ADR-011: all model inference on the Arc 140V iGPU
steps = 30              # base RealVisXL V5.0 uses the DDIM scheduler (NOT a Lightning few-step model), which needs ~25-40 steps; 6 produced pure noise (#666 go-live). Tune for quality/speed.
# Sampler / quality knobs (UC-010 quality tuning, #666). The base RealVisXL V5.0
# ships a DDIM scheduler; EULER_ANCESTRAL_DISCRETE renders sharper detail at the
# same step count. Valid: AUTO (= model default), DDIM, EULER_DISCRETE,
# EULER_ANCESTRAL_DISCRETE, LMS_DISCRETE, PNDM (an unknown value fails soft to
# the model default at load).
scheduler = "EULER_ANCESTRAL_DISCRETE"
# Classifier-free guidance — the prompt-adherence / contrast knob. SDXL sweet
# spot ~5-8; RealVisXL tolerates ~3-7 for natural photoreal output. Range [0,30].
guidance_scale = 7.0
# QUALITY negative prompt — steers AWAY from the common artifact failure modes
# (blur, bad hands/anatomy, watermarks). This is a QUALITY steer ONLY: it carries
# NO content/subject terms, so it does NOT re-censor the deliberately uncensored
# model (ADR-033 §content-safety). Clear it ("") to disable; an explicit per-call
# negative prompt overrides it.
negative_prompt = "blurry, low quality, worst quality, low resolution, deformed, disfigured, bad anatomy, malformed limbs, extra limbs, extra fingers, fused fingers, mutated hands, poorly drawn hands, poorly drawn face, mutation, ugly, watermark, signature, text, jpeg artifacts, grainy"
# Hires-fix second pass (UC-010 #666). After the base 1024^2 generate, upscale by
# hires_factor and run a LOW-strength img2img refine — this gives small regions
# (notably FACES) more pixels to resolve, the proven fix for soft faces in wide
# shots. Cost: ~2x generation time (a second model load + pass). hires_max_edge
# is a GPU-OOM circuit breaker: the refine runs co-resident with the always-on
# 14B, so 1536 is the aggressive-but-usually-fits ceiling. If a generate
# fail-softs to the base image (watch launcher.log for "hires-fix refine" then a
# fall-back), lower hires_factor to 1.25 (or hires_max_edge to 1280). Set
# hires_enabled=false for fast drafts.
# DISABLED 2026-07-02 (operator live-verify): on the 258V/Arc-140V/31.3 GB box the
# 1536^2 hires refine drove SYSTEM RAM to 100% (avail=8 MB) EVEN with the 14B
# evicted — the generate then took ~209 s (past the 175 s UI failsafe → false
# "timed out") AND left the process degraded so the next /save reported a stale
# "Insufficient memory" with 22 GB actually free. Base 1024^2 peaks ~62% RAM and
# is fast + stable, so hires is off by default here. Re-enable ONLY at a reduced
# ceiling (hires_max_edge=1280, hires_factor=1.25) and re-measure RAM headroom.
hires_enabled = false
hires_factor = 1.5
hires_strength = 0.4
hires_max_edge = 1536
max_width = 1024        # circuit breaker (GPU-OOM / memory-DoS, ADR-033 §H)
max_height = 1024
# RESERVED knob (validated + plumbed, NOT yet consumed): the diffusion pipeline
# is evicted after EVERY generate by the caller's `finally` (the sole live
# eviction), so no idle-unload daemon ships today; a timer mirroring substrate
# #611 is a future option. Kept for forward-compat and so the value is on record.
idle_unload_s = 60
# FUT-04 parity with the 14B (ADR-018 / ADR-033 WS1). When true the nested SDXL
# manifest MUST be present AND carry a valid TPM .sig or the load refuses
# fail-closed (no SKIP-with-WARNING). Shipped true so the go-live ceremony has to
# stage + sign the manifest before flipping enabled. DORMANT-SAFE: verify fires
# only when enabled=true AND the model is present, so it never engages on the
# shipped (enabled=false, model-absent) default.
# capabilities(image_generation.require_signed_manifest):
#   nested-manifest-signature-gate = shared/inference/image_gen.py::_verify_weights
require_signed_manifest = true
# UC-010 image STYLE is selected PER REQUEST (#703): the chat command sets the
# style on the IMAGE_GEN_REQUEST — /imagine→photoreal (the SDXL above),
# /illustrate→flat-vector (base SDXL below, no LoRA), /cartoon→cartoon (the SAME
# base SDXL + the flat-vector LoRA applied at RUNTIME, never fused).
# Illustration model — base Stable Diffusion XL 1.0, OV INT8 (#703). SHARED by
# /illustrate (no LoRA) AND /cartoon (+ runtime LoRA). models/ is gitignored ⇒
# absent on a clean checkout. Manifest staged by
#   BLARAI_MODEL_DIR=... python -m shared.models.stage_production_manifest --nested
# then SIGNED by shared.models.manifest_signer.sign_manifest.
illustration_model_dir = "models/sdxl-illustration/openvino-int8-gpu"
illustration_weight_manifest = "models/sdxl-illustration/openvino-int8-gpu/manifest.json"
# Flat-vector LoRA for /cartoon, applied at RUNTIME (ov_genai AdapterConfig) over
# the base SDXL above — NEVER fused (fusing collapsed prompt conditioning).
# illustration_lora_alpha is the style strength; illustration_lora_sha256 (when
# non-empty) is integrity-verified before load (fail-soft to no adapter on a
# mismatch). models/ is gitignored ⇒ the LoRA is absent on a clean checkout
# (cartoon then fail-softs to flat — no adapter).
illustration_lora_path = "models/sdxl-illustration/lora/DD-vector-v2.safetensors"
illustration_lora_alpha = 0.8
illustration_lora_sha256 = "b4c8132f85ab7d75f5789eaf0054153a6011b505719f1253fb7d8837a498fe89"

[fleet_dispatch]
# Headless-coding DISPATCH (agentic-setup brief §9) — BlarAI enqueues a coding
# task to the EXISTING coding fleet (30B / OVMS / worktrees / verify-gate /
# auto-merge), triggers a run, and reads back the run summary. BlarAI embeds NO
# coder; it calls the fleet's documented entry points (add-fleet-task.ps1 /
# run-fleet.ps1) against the operator's OTHER project repos (the fleet refuses
# ~/BlarAI). Local host subprocess only — NO network egress.
# Dormant default is false: with this false /dispatch returns a clear disabled
# notice and NO subprocess is ever spawned. Increment 2's 14B-driven task
# decomposition + host-level model-swap automation (the 14B and the fleet's 30B
# cannot co-reside — milestone 1) sit behind this same flag.
# capabilities(fleet_dispatch.enabled):
#   enqueue-coding-task = shared/fleet/dispatch.py::enqueue_task
#   run-fleet = shared/fleet/dispatch.py::run_fleet
#   read-run-summary = shared/fleet/dispatch.py::read_summary
enabled = true   # GO-LIVE 2026-06-27 (#670): flipped by 20c95530 "make the dispatch LIVE". Local subprocess only; no egress.

# #819 — requirements-clarification stage. When true (the default, proven-defaults-live)
# an interactive /dispatch whose goal is underspecified is asked a FEW targeted, plain-
# language questions (where it runs, whether data is saved, the must-work feature, the
# look, the size) BEFORE the work is broken down; the answers thread into decompose + the
# acceptance oracle + every task so the coder builds to them. A goal that already carries
# those answers is asked NOTHING (a sufficiency check, not a quiz). A battery/headless card
# dispatch NEVER clarifies (the card IS the spec), so the operator-less harness can't hang.
# Set false to send every /dispatch straight to decompose (pre-#819 behaviour).
clarify = true

# #820 — plan-feedback revision loop. When true (the default, proven-defaults-live) an
# operator who gives free-text feedback on a PENDING plan card (`/dispatch revise <what to
# change>`) gets the 14B to REVISE the existing breakdown — tasks added/removed/reordered/
# re-scoped per the feedback, every untouched task preserved byte-for-byte — instead of
# rejecting and re-rolling the whole plan from scratch. Bounded (3 revisions per plan, surfaced
# honestly); each revision replaces the pending plan and re-renders with a plain-language
# CHANGED-vs-KEPT delta; an incoherent revision re-renders the ORIGINAL card untouched (never a
# lost plan). Revision is OPERATOR-INITIATED only, so a battery/headless run never revises.
# Set false to refuse `/dispatch revise` (accept/reject unchanged). Set false to disable.
revise = true

# #1120/#1124 — PROJECT MEMORY. Remember what you have already told BlarAI about a project.
#
# THIS COMMENT IS THE CEREMONY'S PRIMARY ARTIFACT — what the operator reads before flipping
# the key. It describes ONLY what the flag does today.
#
# WHAT IT DOES WHEN TRUE. When BlarAI asks you clarifying questions and you answer them,
# those answers are stored — encrypted, keyed by project — and reused on the NEXT dispatch
# for that same project, so rejecting a plan no longer throws away everything you said. The
# plan card shows what is being carried, under its own heading, and
# `/dispatch forget <project>` clears it.
#
# WHAT YOU ARE ACTUALLY DECIDING (the reason this is a ceremony and not a default).
# Turning this ON means BlarAI RETAINS your typed project descriptions and answers
# INDEFINITELY — there is no expiry and no size cap — and REPLAYS them into the planning
# prompt on every later dispatch for that project. The content is born-encrypted at rest the
# whole time and never leaves the machine; the decision is about RETENTION, not exposure.
#
# KNOWN LIMITATIONS AT THIS FLAG'S FIRST GO-LIVE (2026-07-27 independent review, #1123-#1125
# track the fixes). Read these before flipping:
#   * Once a project has ANY remembered answer, BlarAI STOPS ASKING clarifying questions for
#     that project, and the old goal's answers are applied to every NEW goal on it. Safe for
#     re-running the SAME goal; wrong for a different one on the same project.
#   * Deleting a conversation does NOT delete what was remembered.
#   * There is no listing surface — you cannot see everything BlarAI has banked, only what a
#     given plan card shows.
# Until those land, the honest guidance is: turn it on for a focused validation run, turn it
# off again afterwards.
#
# FALSE (the shipped default) is FULL DORMANCY, not a degraded mode: nothing is recalled,
# nothing is written, no row is created, and the corridor behaves EXACTLY as it did before
# #1120 — including the pre-#1120 amnesia this feature exists to fix. Flipping back to false
# is a complete, immediate off-switch; it does not delete rows already written (use
# `/dispatch forget <project>` for that, or delete dispatch_state.db).
#
# Runbook: docs/runbooks/dispatch_project_memory_go_live.md
# capabilities(fleet_dispatch.project_memory):
#   project-memory-write = services/ui_gateway/src/dispatch_state_store.py::remember_answers
#   project-memory-read = services/ui_gateway/src/dispatch_state_store.py::recall_answers
#   project-memory-erase = services/ui_gateway/src/dispatch_state_store.py::forget_answers
#   project-memory-replay = services/ui_gateway/src/dispatch_coordinator.py::_recall
project_memory = false

# #1031 — the ADVANCED INTAKE front (staged specification), SLICE S1 ONLY.
#
# THIS COMMENT IS THE CEREMONY'S PRIMARY ARTIFACT — what the operator reads before flipping
# the key — so it describes ONLY what the flag does today. An earlier version described the
# whole S1–S4 programme as though S1 shipped it: the operator would have enabled "blocking
# coverage enforcement" and a "wider interview" and received neither. Caught by independent
# pre-merge review before the ceremony ran (#1042).
#
# WHAT true DOES TODAY — two deterministic rulers over the criteria list, and nothing else:
#   1. REALISM GUARD — a criterion claiming an objective tier whose `check` is EMPTY is
#      demoted to human-judged. ONLY the empty case: the wider ambition (demote any check
#      "naming no runnable verification") was WITHDRAWN during review, because a substring
#      allowlist over free-form English cannot decide runnability. Never promotes, never
#      manufactures a check, never auto-passes.
#   2. DELIVERY FLOOR — a web / web-static spec gains a machine-gated SMOKE criterion
#      asserting the served page loads.
#
# WHAT IT DOES NOT DO — none of it enabled by this key:
#   * NO wider elicitation interview — the clarify stage is untouched.
#   * NO co-authored acceptance criteria FROM THIS KEY — the criteria prompt this key runs is
#     untouched. Co-authoring is `advanced_intake_coherence_gate` below, which needs its own
#     flip AND this one; this key alone never engages it.
#   * NO 1:1 oracle import contract — oracle authoring is untouched.
#   * The plan-time coverage check stays WARN-LOUD in both modes; it never blocks approval.
#   * NO bad-input exam floor — that is `advanced_intake_bad_input_floor` below, which needs
#     BOTH keys, so turning this one on can never change what a build is graded on.
#
# WENT LIVE at the LA-present go-live ceremony 2026-07-22 (#1031), flipped from its shipped
# default. Reverting is a full undo: set this back to false and restart, and the next plan is
# byte-identical to the prior behaviour (demonstrated by digest across 7 scenarios), because
# these two rulers only shape the plan at plan time and touch nothing already built. Its
# go-live was an LA ceremony, not a proven-defaults flip, because it is a new capability on
# the operator-facing front. Procedure of record: docs/runbooks/advanced_intake_go_live.md.
#
# VALIDATED, NOT COERCED (#1042): only an explicit boolean `true` enables this. A quoted
# "false" — the shape a hand-edited rollback takes — previously coerced to TRUE and silently
# engaged the capability; it and every other non-boolean value now resolve false.
# capabilities(fleet_dispatch.advanced_intake):
#   empty-check-realism-guard = shared/fleet/acceptance.py::_apply_realism_guard
#   web-delivery-floor = shared/fleet/acceptance.py::_ensure_delivery_floor
advanced_intake = true   # GO-LIVE 2026-07-22 (#1031): the two intake rulers act on every non-card dispatch

# The BAD-INPUT EXAM FLOOR (#1044) — a sub-gate of the advanced-intake front above. BOTH keys
# must be true before it acts; `advanced_intake` alone does nothing here.
#
# WHY IT EXISTS — a measured hole, not a hypothesis. A flashcards build passed its per-task
# oracles, its job-level exam, the sandbox's own eight test files, AND our quality juror (which
# scored it "bad input handling: graceful") — and the shipped code crashed on two ordinary
# inputs: a card with a missing field, and an answer that was not text. Both were confirmed by
# running the shipped file. GREEN meant "the happy path works", and every capability number
# resting on a GREEN rate carries that caveat until this closes.
#
# WHAT true DOES — for a PYTHON acceptance exam only, and only on an operator dispatch: every
# entry point the exam already drives gains a machine-written test that feeds it malformed
# input (empty, missing, wrong-type, missing-field) and requires it not to fall over. The test
# is INJECTED by machinery, never asked of the model. REJECTING bad input passes — refusing an
# argument with a clear error is correct handling; only an unhandled crash fails.
#
# WHAT IT DOES NOT DO:
#   * It does NOT judge whether the handling is GOOD, only that the thing does not crash. A
#     build can satisfy it shallowly. Scoring the quality of the handling is a new grading
#     layer and a separate decision.
#   * It does NOT touch a battery/headless card dispatch — a card IS its own exam, frozen so
#     nights stay comparable.
#   * It does NOT apply to a node/JavaScript exam — the same probe would assert a much weaker
#     property there, and a weak assertion made loudly is worse than none.
#   * It does NOT change the plan, the criteria, or the coverage warning. Only the exam bytes.
#
# WHY ITS OWN KEY AND ITS OWN CEREMONY: it changes what a build is GRADED on. A build that
# only ever worked on the happy path now fails an exam it used to pass, so GREEN rates measured
# before and after are not the same measurement. That is a capability decision, not a rider on
# an already-live flag. Reverting is a full undo: set false and restart; the next plan's exam
# bytes are byte-identical to the prior behaviour.
#
# VALIDATED, NOT COERCED (#1042): only an explicit boolean `true` enables this; a quoted
# "false" and every other non-boolean value resolve false.
# capabilities(fleet_dispatch.advanced_intake_bad_input_floor):
#   bad-input-exam-floor = shared/fleet/bad_input_floor.py::inject_bad_input_floor
#   exam-floor-gate = shared/fleet/acceptance.py::_ensure_bad_input_floor
advanced_intake_bad_input_floor = true   # GO-LIVE 2026-07-29 (#1069 batched S3 ceremony, LA-present): every python exam gains the machine-injected bad-input assertions

# #1054 (S3 slice E) — COHERENCE BY SINGLE AUTHORSHIP. A SEPARATE flip inside the advanced
# intake front. It needs `advanced_intake` above to be true AS WELL; on its own it does
# nothing, and the front being live is not consent for what lands inside it later.
#
# THE DEFECT IT RETIRES, measured on a real dispatch (2026-07-22, water-tracker): the plan's
# assumptions said "Assumed a reset button is not needed" while its acceptance criteria said
# "The web page includes a reset button…". One document told the coder both that a capability
# was out of scope and that it was a graded requirement, because the assumptions and the
# criteria came from two model calls that never saw each other's output.
#
# WHAT true DOES — two things, and the second is the one with teeth:
#   1. SINGLE-PASS AUTHORING — the criteria and the assumptions are written in ONE model call
#      whose prompt carries both jobs, so the scope decision is made once, in one context.
#      The same prompt carries a SCOPE ANCHOR (assert only behaviours the request names),
#      which is the other half of the same live defect: that plan also invented goal-setting
#      and history features the goal never mentioned.
#   2. A DETERMINISTIC CONTRADICTION GATE — after authoring, the (assumption, criteria) pair
#      is parsed and the plan is REFUSED when a criterion requires a capability an assumption
#      ruled out, or the reverse. The prompt is vigilance; this is the control, and it holds
#      even if a future model regresses.
#
# THIS IS A CAPABILITY CHANGE, which is why it is a ceremony and not a proven-defaults flip:
# a dispatch that could previously only be PLANNED can now be REFUSED at plan time. The
# refusal is plain-language, names the two statements that disagree, enqueues nothing, and
# leaves reject/re-dispatch open — it never edits the plan to reconcile it, because choosing
# which half was wrong is the operator's judgement, not a rule.
#
# WHAT IT DOES NOT DO: no elicitation interview; no oracle import contract; the plan-time
# coverage check stays WARN-LOUD in both modes and still never blocks approval. It never runs
# for a battery/headless card dispatch — the card IS the spec and is frozen for cross-night
# comparability, the same self-suppression the two S1 rulers carry.
#
# ---------------------------------------------------------------------------------------
# WHAT CAN GO WRONG, in both directions. Read this before flipping it — the first version of
# this comment described only the MISSES, and a control that can also REFUSE YOUR GOOD PLAN
# must say so where the decision is made.
#
#   * IT CAN REFUSE A PLAN THAT WAS FINE — and there is a KNOWN, UNFIXED way it does. The
#     gate reads ordinary English with patterns, and a pattern can be wrong. When that
#     happens you lose the plan: you are told which two sentences it believes disagree,
#     nothing is built, and you dispatch again.
#
#     THREE such faults have been found. Two are fixed and locked:
#       - an ordinary two-clause sentence — "a reset button would be useful, but it is not
#         needed for now" — was refused because of the COMMA;
#       - "the app launches without an error message" was read as banning error messages.
#
#     THE THIRD IS STILL PRESENT (#1096). When a sentence says a feature is not wanted in one
#     PLACE or one FORM, the gate hears it as not wanted at all:
#       - "The user data is not stored on a server", alongside an assumption that the user
#         data stays in the browser;
#       - "The reset button is not shown on the print view".
#     Both plans are perfectly consistent, and both are refused. It is not new — it has been
#     there since the first version of this feature — and it is disclosed rather than fixed
#     because fixing it means changing the matching logic, which is the kind of change that
#     has been introducing fresh faults on this tree.
#
#     The test sets measure ZERO wrong refusals across 30 plans, and that number is real —
#     but it was measured on plans that happen not to contain the third shape, which is
#     exactly how the shape survived two independent reviews. Read "zero" as "none left that
#     we knew how to look for", never as "impossible".
#
#   * IT MISSES MORE THAN IT CATCHES. It only sees a disagreement about a capability named in
#     TWO OR MORE words ("reset button", "dark mode"). Every one of the ten commonest
#     one-word features — history, search, undo, login, pagination, notifications, autosave,
#     printing, charts, sorting — escapes entirely. It also misses "the reset button is not
#     shown until an entry exists" (#1095), which does require a reset button. Measured
#     across BOTH test sets it caught 22 of 36 planted contradictions — about 61%. A single
#     test set read 14 of 16 and made it look like 88%; the two-set figure is the honest one.
#
#   * IT DECIDES CONTRADICTION, NOT CORRECTNESS. Two statements that agree with each other and
#     are both wrong about what you asked for pass cleanly. This is a floor against a plan
#     arguing with itself, not a check that the plan is any good.
# ---------------------------------------------------------------------------------------
#
# Reverting is a full undo: set back to false and restart, and authoring returns to the
# two-call path with no gate. Procedure of record — its OWN ceremony, separate from the
# front's: docs/runbooks/advanced_intake_coherence_gate_go_live.md.
#
# VALIDATED, NOT COERCED (#1042 rule): only an explicit boolean `true` enables this. Every
# other value — a quoted "false", "true", 1, [] — resolves false.
# capabilities(fleet_dispatch.advanced_intake_coherence_gate):
#   coauthored-criteria-and-assumptions = shared/fleet/acceptance.py::_COAUTHORED_TEMPLATE
#   single-pass-authoring = shared/fleet/acceptance.py::_coauthor_spec
#   deterministic-coherence-gate = shared/fleet/coherence.py::check_coherence
advanced_intake_coherence_gate = true   # GO-LIVE 2026-07-29 (#1069 batched S3 ceremony, LA-present): single-pass authoring + the deterministic contradiction gate

# #1069 (S3 slice F) — the COVERAGE GATE. A SEPARATE flip inside the advanced-intake front;
# it needs `advanced_intake` above to be true AS WELL — on its own it does nothing, and the
# front being live is not consent for what lands inside it later.
#
# THE DEFECT IT RETIRES, measured across a campaign (#989/#1008): a build task owning no
# module the job exam imports tends to build far beyond its slice (the B4 sprawl shape), and
# an exam import no task owns is a module nobody is told to build — either way the exam
# cannot verify the plan, the run still reports GREEN, and that GREEN enters the capability
# record meaning nothing. Warn-loud is what the system does today, and #989/#1008 happened
# anyway: a warning that can be clicked through is a note, not a control.
#
# WHAT IT DOES — only with BOTH keys true, only on the multi-task job-exam shape, and never
# for a battery card (`battery-*` sandboxes self-suppress; the card IS the instrument):
#   * the exam author's prompt carries a deterministic 1:1 import pin derived from the task
#     contracts (coverage BY CONSTRUCTION — the model is told the import set, not hoped at);
#   * a residual coverage gap triggers ONE bounded re-authoring with the gap named; a repair
#     that comes back empty is discarded (a gappy exam never degrades into NO exam);
#   * a gap that survives BLOCKS approval: the card renders with the gap named, revise and
#     reject stay open, and a revision that measurably closes the gap unblocks approve (the
#     gateway re-runs the same deterministic check after every revision).
# WHAT IT DOES NOT DO:
#   * the quick path stays WARN-LOUD — the capability boundary its own docstring states
#     (shared/fleet/acceptance.py::_plan_contract_coverage_warning) is unchanged;
#   * a single-task plan is never gated (it owns everything by construction);
#   * a plan that honestly authors NO exam (build-only ecosystems, .NET etc.) is a
#     DISCLOSED absence, not a gap — never blocked;
#   * nothing here touches egress, the coordinator write path, or any store.
#
# LA framing of record (#1069 c.2512): "It's less 'the system tells you no' and more 'the
# system won't let you sign something it couldn't check.'" Ratified #1069 c.2461. Goes live
# ONLY at the batched S3 D/E/F/G ceremony — one flag-flip session across the four slices.
#
# Reverting is a full undo: set back to false and restart, and planning returns to the
# warn-loud path byte-identically.
#
# VALIDATED, NOT COERCED (#1042 rule): only an explicit boolean `true` enables this. Every
# other value — a quoted "false", "true", 1, [] — resolves false.
# The approve refusal itself lives in DispatchCoordinator._approve (a method, so it is
# named here in prose; the declaration below names the module-level symbols).
# capabilities(fleet_dispatch.advanced_intake_coverage_gate):
#   coverage-by-construction-pin = shared/fleet/acceptance.py::_coverage_contract_block
#   measured-clean-release-rule = shared/fleet/acceptance.py::_coverage_measured_clean
#   blocking-marker-builder = shared/fleet/acceptance.py::_coverage_blocked_message
#   post-revision-re-evaluation = services/ui_gateway/src/dispatch_coordinator.py::_riding_job_oracle
advanced_intake_coverage_gate = true   # GO-LIVE 2026-07-29 (#1069 batched S3 ceremony, LA-present): the exam's import pin + ONE bounded repair + approval BLOCKS on a surviving gap

# #1069 (S3 slice G) — CRITERIA REVISION (#1055 part 2). A SEPARATE flip inside the
# advanced-intake front; it needs `advanced_intake` above to be true AS WELL — on its own it
# does nothing.
#
# THE DEFECT IT RETIRES, hit live by the operator (#1055, 2026-07-22): revise edits the
# plan's TASKS, never the criteria, and its old failure message invited rephrasing — a loop
# that could never succeed. Slice A shipped the honest message (live since 70d5ddee); this
# key is the real capability behind it: criteria/scope feedback on a pending plan runs a
# criteria-revise model call, and the operator's judged checklist actually changes.
#
# WHAT IT DOES — only with BOTH keys true, and only when a task-revision yielded no change
# and the feedback reads as criteria/scope:
#   * the operator-judged criteria (visual / human) may be reworded, removed, or added —
#     an added criterion is FORCED to the human tier;
#   * the deterministic floors are re-injected and the realism guard re-applied after every
#     criteria revision (a revision cannot strip a floor — two independent locks: the
#     machine wall below, and the idempotent re-injection);
#   * the delta card leads with reworded/added/removed/protected, in plain language.
# WHAT IT DOES NOT DO — the MACHINE WALL, and it is load-bearing:
#   * machine-gated criteria (build / behavior / smoke) are KEEP-ONLY: a rescope aimed at
#     one is discarded and reported "protected", and an omitted one is auto-kept. The
#     compiled task prompts and the riding exam consume ONLY machine tiers and are frozen
#     at plan time (#877/#820 safety asymmetry), so if this path could edit a machine
#     criterion the card would show one assertion while the exam tested another. Changing
#     an automatic check remains reject + re-dispatch, and the card says so.
#   * the compiled task prompts and the exam bytes are byte-identical through any criteria
#     revision, by construction; the shared 3-revision budget is consumed as usual.
# Goes live ONLY at the batched S3 D/E/F/G ceremony.
#
# Reverting is a full undo: set back to false and restart — a criteria-revise request is
# then refused Fail-Closed AO-side and the gateway renders the honest #1055 message,
# byte-identically to pre-G behaviour.
#
# VALIDATED, NOT COERCED (#1042 rule): only an explicit boolean `true` enables this. Every
# other value — a quoted "false", "true", 1, [] — resolves false.
# capabilities(fleet_dispatch.advanced_intake_criteria_revise):
#   criteria-edit-ruler = shared/fleet/revise.py::apply_criteria_revision_ops
#   criteria-revise-sentinel = shared/fleet/revise.py::CRITERIA_REVISE_SENTINEL
#   criteria-delta-card = shared/fleet/revise.py::render_criteria_revision_delta
advanced_intake_criteria_revise = true   # GO-LIVE 2026-07-29 (#1069 batched S3 ceremony, LA-present): the judged checklist becomes editable; machine tiers stay keep-only (the wall)

# #1031 (S2) — the ADVANCED-INTAKE INTERVIEW. A SEPARATE flip inside the advanced-intake
# front; it needs `advanced_intake` above to be true AS WELL — that key's own comment
# promises "NO wider elicitation interview", and this key is where the promise is kept.
# It ALSO rides the clarify stage: real engagement is `clarify` AND `advanced_intake` AND
# this key (with `clarify = false` an `advanced` dispatch asks nothing and says so).
#
# THE GAP IT CLOSES, measured three ways: content was never elicited (a build invented
# placeholder projects and presented them as real — the quality ledger's operator-
# experience row); the operator's own awkward cases never reached a spec (#1044's class,
# which the machine floor catches but cannot phrase in the operator's words); non-goals
# were always inferred, never authored (and the revise wall is deliberately one-way, so
# the intake is the only place a scope fence is born with the operator's authority).
#
# WHAT IT DOES — only with the keys above true, and ONLY when the operator asks:
#   * `/dispatch advanced <project> | <goal>` (and `advanced new <name> | <goal>`) runs
#     the FULLER interview — the five quick-path decision areas plus content, edge cases,
#     and non-goals — still one screenful (a structural one-per-axis cap of 8), still one
#     free-text reply, still "just decide for me" with recorded defaults;
#   * a long quick-path ask may end with ONE hint line naming the `advanced` form;
#   * each recorded answer is tagged with the decision area(s) it covered on the run's
#     acceptance record (labels on entries that already persist — no new store).
# WHAT IT DOES NOT DO:
#   * a normal `/dispatch` is byte-identical to today, in BOTH states of this key;
#   * nobody is interviewed without asking — no size or ambiguity heuristic ever enters
#     the mode (rejected as a least-surprise violation; the hint line is the whole nudge);
#   * battery/headless cards never interview (the clarify gate's own card suppression);
#   * an interview failure never blocks a dispatch — it degrades to the quick behaviour.
# Go-live/reversal is an LA ceremony (procedure of record:
# docs/runbooks/advanced_intake_interview_go_live.md). The remembered-answers decision
# is settled: `advanced` DEFERS to memory, with `/dispatch forget <project>` as the
# fresh-interview escape (docs/DECISION_REGISTER.md, 2026-07-29).
#
# Reverting is a full undo: set back to false and restart — the token stops parsing, the
# marker is inert text, and the next dispatch is byte-identical to the pre-go-live front.
#
# VALIDATED, NOT COERCED (#1042 rule): only an explicit boolean `true` enables this. Every
# other value — a quoted "false", "true", 1, [] — resolves false.
# capabilities(fleet_dispatch.advanced_intake_interview):
#   intake-axes-vocabulary = shared/fleet/clarify.py::INTAKE_AXES
#   intake-interview-template = shared/fleet/clarify.py::_INTAKE_TEMPLATE
#   intake-mode-marker = shared/fleet/clarify.py::INTAKE_SENTINEL
advanced_intake_interview = true   # GO-LIVE 2026-07-29 (#1031 S2 ceremony, LA-present): the fuller `advanced` interview — content/edge-cases/non-goals among the axes; defers to remembered answers

# #1165 (M5) — the OPERATOR-ASSETS PIPELINE. A SEPARATE flip inside the advanced-intake
# front; it needs `advanced_intake` above to be true AS WELL. Deliberately INDEPENDENT of
# `advanced_intake_interview`: files the operator placed in a project's `assets` folder
# are explicit intent on ANY advanced-front dispatch, and the plan card's acknowledgment
# keeps the result visible and vetoable — no interview needs to have run.
#
# THE GAP IT CLOSES (#1165, the LA's capability A): there was no place to PUT your own
# photos, logo, documents, or data — builds invented placeholder stand-ins even when the
# real material existed. Now every project has an `assets` folder (new projects are
# created with it, plus an `assets/reference` subfolder for screenshots to emulate);
# drop files in with File Explorer and the next plan works from them.
#
# WHAT IT DOES — only with both keys true, and never for a battery/headless card:
#   * at PLAN time the folder is enumerated ONCE, AO-side — rooted walk, ALL reparse
#     points (symlinks/junctions/mount points) excluded fail-closed with containment
#     re-checked after resolution, a conservative filename allowlist (non-conforming
#     files are skipped and the card says so), a closed extension allowlist classified
#     image/document/data/code/other, per-file and total size caps, relative paths only;
#   * the manifest rides the spec as `operator_assets` — the single carrier the card
#     acknowledgment ("Working from your assets folder: …"), the injected use checks,
#     and the conditional `operator_assets_json` task field all read;
#   * web builds gain a MACHINE-gated wiring floor (at least one provided filename
#     referenced in the built pages — presence asserts wiring, not rendering) that the
#     criteria-revision wall keeps keep-only and re-injection restores (two independent
#     locks); every build with assets gains an OPERATOR-tier visual criterion ("your
#     files visibly appear"), deliberately revisable/droppable like any judged item.
# WHAT IT DOES NOT DO:
#   * paths TYPED in interview answers are recorded words — NEVER dereferenced; the
#     system acts only on its own enumeration of the folder;
#   * file CONTENTS never ride the manifest, the card, or the record — names, classes
